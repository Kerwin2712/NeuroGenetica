uto enfocado para ver su cámara y sensores. |\n| **`V`** | Alternar modo de cámara (**GTA Cenital**, **Isométrica Libre**, **Isométrica Auto**, **3ª Persona**). |\n| **`Espacio`** | Velocidad de simulación (**1x**, **2x**, **4x**). |\n\n\n\n---\n\n## 🚀 Cómo Ejecutar\n\n* **Directo a la simulación**: Haz doble clic en **`ejecutar_juego_godot.bat`**.\n* **Abrir en el editor**: Haz doble clic en **`abrir_editor_godot.bat`**.\n"}, "GUIA_GODOT.md": "guia_godot", "guion_video": {"id": "guion_video", "filename": "GUION_VIDEO.md", "title": "Guion de Video por Integrante", "icon": "🎬", "category": "Presentación", "badge": "Defensa", "content": "# 🎬 Guion de Exposición y Grabación de Video: NeuroGenetica\n\nEste documento contiene el guion técnico y narrativo detallado para grabar el video de presentación y defensa del proyecto **NeuroGenetica** para la materia *Programación 3*.\n\n---\n\n## 📋 Ficha Técnica del Video\n\n- **Duración Estimada Total**: 5 a 7 minutos.\n- **Herramienta de Grabación recomendada**: [OBS Studio](https://obsproject.com/) o [Loom](https://www.loom.com/) a 1080p y 60 FPS.\n- **Recursos a proyectar durante la grabación**:\n  1. **Visualizador Dinámico**: Abrir [`docs/showcase.html`](showcase.html) en el navegador web (presionar <kbd>F11</kbd> para pantalla completa limpia).\n  2. **Juego en Vivo**: Ejecutable [`build/NeuroGenetica.exe`](../build/NeuroGenetica.exe) compilado con Raylib.\n  3. **Terminal de Tests**: Ejecución de pruebas unitarias (`ctest --test-dir build --output-on-failure`).\n- **Participantes**:\n  - **Rafael Hernandez**: Motor Gráfico, Gamificación y Modos de Juego.\n  - **Javier Olivieri**: Cinemática, Raycasting de Sensores y Estructura QuadTree 2D.\n  - **Kerwin Quintero**: Red Neuronal Feedforward, Neuroevolución y Estructura Max-Heap.\n\n---\n\n## ⏱️ Estructura y Cronograma del Video\n\n| Bloque / Escena | Tiempo Estimado | Responsable Sugerido | Recurso en Pantalla |\n| :--- | :---: | :---: | :--- |\n| **Escena 1: Introducción y Propuesta Jugable** | 00:00 - 01:15 | Rafael Hernandez | `showcase.html` (Diapositiva 1 y Pestaña *Modos de Juego*) |\n| **Escena 2: Cinemática, Sensores y QuadTree** | 01:15 - 02:45 | Javier Olivieri | `showcase.html` (Pestaña *QuadTree en Vivo*) |\n| **Escena 3: Red Neuronal y Max-Heap** | 02:45 - 04:15 | Kerwin Quintero | `showcase.html` (Pestañas *Red Neuronal* y *Max-Heap*) |\n| **Escena 4: Demostración del Videojuego en Raylib** | 04:15 - 05:45 | Todo el equipo | Ventana de `NeuroGenetica.exe` (conducción y evolución) |\n| **Escena 5: Pruebas CTest, Git Flow y Cierre** | 05:45 - 06:30 | Todo el equipo | Terminal con `ctest` y Diapositiva Final |\n\n---\n\n## 🎙️ Guion Paso a Paso (Locución y Acciones)\n\n---\n\n### 🎬 Escena 1: Introducción y Propuesta Jugable [00:00 - 01:15]\n\n#### 🖥️ En Pantalla:\n1. Abrir `docs/showcase.html` en pantalla completa (<kbd>F11</kbd>).\n2. Comenzar en la pestaña **Diapositivas Video** (Diapositiva 1).\n3. A los 40 segundos, hacer clic en la pestaña **Modos de Juego** para mostrar las tarjetas interactivas de *Modo Copa*, *Carrera Única*, *Carretera Vertical* y la diferenciación de rivales por color.\n\n#### 🗣️ Locución (Rafael Hernandez):\n> \"Saludos a todos. Bienvenidos a la presentación de **NeuroGenetica**, nuestro proyecto para la materia Programación 3, desarrollado por Javier Olivieri, Kerwin Quintero y mi persona, Rafael Hernandez, bajo la tutoría del profesor Alejandro Mujica y los preparadores Jesús León y Sarai Rojas.\n>\n> Nuestra propuesta consiste en el desarrollo de un **Videojuego de Carreras interactivo en C++17** con la biblioteca gráfica Raylib, donde el jugador no solo recorre circuitos cerrados, sino que compite en tiempo real contra rivales controlados por **Inteligencia Artificial Adaptativa**.\n>\n> Diseñamos el juego bajo un enfoque de gamificación que contempla:\n> - El **Modo Copa**, donde los rivales compiten en múltiples pistas y refinan su aprendizaje tras cada carrera.\n> - La **Carrera Única**, para enfrentarse a modelos de IA pre-entrenados o al récord histórico.\n> - Y la modalidad de **Carretera Vertical**, un formato de tráfico y supervivencia.\n>\n> Cada vehículo cuenta con identificación visual por colores: el auto del jugador en azul neón, los líderes élite en oro y los rivales en aprendizaje en tonos púrpuras.\n>\n> Para garantizar que un videojuego con decenas de autos inteligentes funcione de forma fluida a 60 fotogramas por segundo, integramos dos estructuras de datos avanzadas que optimizan las físicas y la selección: el **QuadTree** y el **Max-Heap**.\"\n\n---\n\n### 🎬 Escena 2: Cinemática, Sensores y Estructura QuadTree [01:15 - 02:45]\n\n#### 🖥️ En Pantalla:\n1. Cambiar a la pestaña **🔲 QuadTree en Vivo** en `showcase.html`.\n2. Mover el auto con las teclas `W/A/S/D` o el ratón para que los 5 rayos sensores choquen contra los muros de la pista.\n3. Señalar con el cursor el recuadro ámbar que se ilumina (el cuadrante activo del árbol) y la barra de métricas de aceleración algorítmica ($O(\\log n)$ vs $O(n \\times m)$).\n\n#### 🗣️ Locución (Javier Olivieri):\n> \"Hola a todos, les habla Javier Olivieri. Yo estuve a cargo de la física cinemática del vehículo, el sistema de sensores y la estructura espacial del QuadTree.\n>\n> En el juego, cada coche proyecta **5 rayos de sensores** frontales que miden distancias normalizadas hacia los límites del circuito. Si utilizáramos un enfoque ingenuo de fuerza bruta para verificar cada rayo de cada coche contra todos los segmentos de la pista, estaríamos realizando decenas de miles de cálculos de intersección por cuadro, con una complejidad de $O(N \\times S \\times W)$, lo cual colapsaría el rendimiento del juego.\n>\n> Para solucionar esto, implementamos un **QuadTree (Árbol de Partición Espacial 2D)**. El QuadTree divide recursivamente el plano en cuatro cuadrantes: Noroeste, Noreste, Suroeste y Sureste, con una capacidad máxima de 4 segmentos por nodo.\n>\n> Como pueden observar en este simulador interactivo en pantalla, cuando el vehículo se desplaza y emite sus rayos sensores, el árbol realiza un **podado espacial inmediato**. Solo interroga a los segmentos contenidos en los cuadrantes que los rayos atraviesan, reduciendo la complejidad a **$O(\\log W)$** por consulta.\n>\n> Esto nos otorga una aceleración de más de 10 veces en los cálculos espaciales, permitiendo que la simulación y las colisiones corran de forma perfectamente estable a 60 FPS e incluso a velocidades aceleradas de 2x y 5x.\"\n\n---\n\n### 🎬 Escena 3: Redes Neuronales y Selección con Max-Heap [02:45 - 04:15]\n\n#### 🖥️ En Pantalla:\n1. Cambiar a la pestaña **🧠 Red Neuronal**. Mover los sliders de sensores para ver cómo cambian las conexiones y las salidas de viraje y aceleración. Presionar el botón *\"🎲 Mutar Pesos\"*.\n2. A los 3:30, cambiar a la pestaña **🏔️ Max-Heap**. Mostrar el árbol binario de los coches y presionar el botón *\"PopMax() [Extraer Líder]\"* para mostrar la extracción animada del Top-2 de élite.\n\n#### 🗣️ Locución (Kerwin Quintero):\n> \"Buenas a todos, les habla Kerwin Quintero. Yo me encargué del cerebro de los vehículos, la neuroevolución, la optimización de cálculos de sensores y la aplicación de las estructuras de datos avanzadas: el Max-Heap y el Árbol de Partición Espacial 3D.\n>\n> Cada vehículo enemigo está controlado por una **Red Neuronal Artificial Feedforward**. Recibe 6 entradas normalizadas: las 5 lecturas de distancia de los sensores más la velocidad actual. Estas señales pasan por una capa oculta de 8 neuronas con función de activación tangente hiperbólica ($\\tanh$), y generan 2 salidas continuas: el ángulo de viraje y la aceleración o frenado. En total, cada coche posee un genoma lineal de 74 parámetros flotantes.\n>\n> Para que los rivales aprendan a conducir sin necesidad de un entrenamiento supervisado tradicional, usamos un **Algoritmo Genético**. Evaluamos la aptitud o *fitness* de cada individuo según la cantidad de checkpoints superados de forma secuencial, premiando el avance y penalizando la inactividad.\n>\n> Aquí entra nuestra estructura de datos clave: el **Max-Heap o Cola de Prioridad genérica**, implementado en C++ mediante templates y adaptado a la simulación.\n>\n> Al finalizar cada carrera o generación, no necesitamos ordenar toda la población de autos con algoritmos de costo $O(n \\log n)$. En su lugar, insertamos los participantes en el Max-Heap y extraemos a los líderes mediante la operación `PopMax()`, garantizando la selección de élite y el podio en tiempo **$O(k \\log n)$** gracias al algoritmo `SiftDown`.\n>\n> Además, para el entorno tridimensional optimizamos el cálculo de sensores y la geometría mediante el **SpatialTree3D**, un árbol espacial de cajas envolventes AABB que reduce la verificación de pista de $O(P)$ lineal a **$O(\\log P)$ logarítmico** y elimina raíces cuadradas intermedias mediante comparaciones directas de distancias al cuadrado ($d^2$), garantizando máxima fluidez a 60 FPS.\"\n\n---\n\n### 🎬 Escena 4: Demostración del Videojuego en Raylib [04:15 - 05:45]\n\n#### 🖥️ En Pantalla:\n1. Minimizar el navegador y abrir la ventana del ejecutable compilado: `NeuroGenetica.exe`.\n2. Mostrar la pantalla de inicio con la pista de Gran Premio, los pianos bicolores y la meta.\n3. **Modo Manual**: Manejar el auto azul con `WASD` para demostrar la respuesta física del vehículo y las líneas de impacto de los sensores.\n4. **Modo Autónomo / IA**: Presionar la tecla `M` para activar la población genética completa. Mostrar cómo la IA evalúa a los coches.\n5. **Aceleración**: Presionar la `Barra Espaciadora` para alternar la simulación a $\\times 2$ y $\\times 5$, mostrando la fluidez del juego.\n6. **Debug QuadTree**: Presionar la tecla `Q` para hacer visibles las líneas de subdivisión del QuadTree en tiempo real sobre la pista.\n7. Señalar el panel **HUD en el centro de la pista** con las estadísticas en vivo (generación, autos vivos, mejor fitness histórico y telemetría).\n\n#### 🗣️ Locución (Rafael Hernandez / Equipo):\n> \"Ahora pasamos a ver la ejecución real del juego compilado en C++ con Raylib.\n>\n> En pantalla observamos el circuito de Gran Premio generado con splines Catmull-Rom y sus 69 checkpoints transversales invisibles que impiden cualquier tipo de trampa, como girar en círculos o retroceder.\n>\n> En el modo manual, el jugador humano tiene el control total con WASD. Pero si presionamos la tecla **M**, activamos la simulación de la población autónoma.\n>\n> Vean cómo los coches de la primera generación cometen errores iniciales al explorar la pista, pero aquellos que logran superar más curvas son seleccionados por el Max-Heap. Si aceleramos el tiempo a **2x o 5x con la barra espaciadora**, podemos observar cómo en pocas generaciones los rivales perfeccionan su trazado y aprenden a recortar pianos y esquivar muros a alta velocidad.\n>\n> Al presionar la tecla **Q**, se hace visible la subdivisión dinámica del QuadTree sobre la pista, demostrando cómo la estructura de datos opera en cada milisegundo de ejecución.\"\n\n---\n\n### 🎬 Escena 5: Pruebas Unitarias CTest, Git Flow y Cierre [05:45 - 06:30]\n\n#### 🖥️ En Pantalla:\n1. Abrir la terminal y ejecutar el comando:\n   ```bash\n   ctest --test-dir build --output-on-failure\n   ```\n2. Mostrar la salida con el **100% de pruebas pasando** (`QuadTreeTests`, `NeuralNetworkTests`, `GeneticAlgorithmTests`).\n3. Volver a la última diapositiva de `showcase.html` o al repositorio de GitHub para mostrar el historial de ramas y commits atómicos.\n\n#### 🗣️ Locución (Todo el equipo):\n> \"Para finalizar, queremos destacar la rigurosidad técnica de la entrega:\n> - El proyecto está validado al 100% mediante suites de pruebas unitarias integradas con **CTest**, que garantizan la correctitud matemática de la partición espacial, el forward pass de la red neuronal y las propiedades del montículo máximo antes de conectarse a la interfaz visual.\n> - Todo el desarrollo siguió un flujo estricto de Git con ramas `main`, `development` y ramas de características, utilizando commits atómicos bajo el estándar Conventional Commits y asegurando que ningún binario compilado esté en el repositorio.\n> - El código compila de forma nativa tanto en Windows como en Linux gracias a CMake y FetchContent.\n>\n> Esperamos que hayan disfrutado de la demostración de **NeuroGenetica**. Muchas gracias por su atención.\"\n\n---\n\n## 💡 Consejos Prácticos para la Grabación\n\n1. **Resolución y Fuente**: Graba a 1920x1080. En el navegador, pulsa <kbd>F11</kbd> para ocultar pestañas y barra de direcciones.\n2. **Audio Nítido**: Usa auriculares con micrófono o un micrófono condensador en un espacio silencioso.\n3. **Distribución de Roles**: Si graban por separado, cada integrante puede grabar su fragmento de pantalla y voz, y luego unirlos con cualquier editor de video sencillo (como CapCut, Clipchamp o DaVinci Resolve).\n4. **Guion Visible en Otra Pantalla**: Ten este archivo `GUION_VIDEO.md` abierto en tu teléfono, tablet o en un segundo monitor mientras grabas la pantalla principal con `showcase.html` y el ejecutable.\n"}, "GUION_VIDEO.md": "guion_video"};

    const DOC_ORDER = [
      "docs_readme",
      "root_readme",
      "architecture",
      "data_structures",
      "ai_physics",
      "guia_godot",
      "guion_video"
    ];

    let currentDocId = "docs_readme";

    // -------------------------------------------------------------
    // GESTIÓN DE TEMA CLARO (PASTEL APERLADO) / OSCURO (GRISES)
    // -------------------------------------------------------------
    function initTheme() {
      const savedTheme = localStorage.getItem('neuro_theme') || 'dark';
      setTheme(savedTheme);
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains('dark');
      setTheme(isDark ? 'light' : 'dark');
    }

    function setTheme(theme) {
      const icon = document.getElementById('theme-icon');
      const label = document.getElementById('theme-label');

      if (theme === 'light') {
        document.documentElement.classList.remove('dark');
        icon.textContent = '🌙';
        label.textContent = 'Modo Oscuro';
        localStorage.setItem('neuro_theme', 'light');
      } else {
        document.documentElement.classList.add('dark');
        icon.textContent = '☀️';
        label.textContent = 'Modo Claro';
        localStorage.setItem('neuro_theme', 'dark');
      }
    }

    // -------------------------------------------------------------
    // MOTOR DE LECTURA MARKDOWN Y KATEX
    // -------------------------------------------------------------
    function initDocsReader() {
      buildDocsMenu();
      loadDoc(currentDocId);
    }

    function buildDocsMenu() {
      const container = document.getElementById('doc-menu-container');
      if (!container) return;

      const categories = {};
      DOC_ORDER.forEach(id => {
        const doc = EMBEDDED_DOCS[id];
        if (!doc) return;
        if (!categories[doc.category]) categories[doc.category] = [];
        categories[doc.category].push(doc);
      });

      let html = '';
      for (const [cat, docs] of Object.entries(categories)) {
        html += `
          <div style="margin-bottom: 12px;">
            <div class="menu-category-title">${cat}</div>
            <div>
              ${docs.map(d => `
                <button onclick="loadDoc('${d.id}')" id="menu-btn-${d.id}" class="menu-item-btn ${d.id === currentDocId ? 'active' : ''}">
                  <span class="menu-item-left">
                    <span>${d.icon}</span>
                    <span style="overflow: hidden; text-overflow: ellipsis;">${d.title}</span>
                  </span>
                  <span class="menu-item-badge">${d.badge}</span>
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    function loadDoc(docId) {
      if (EMBEDDED_DOCS[docId] && typeof EMBEDDED_DOCS[docId] === 'string') {
        docId = EMBEDDED_DOCS[docId];
      }

      const doc = EMBEDDED_DOCS[docId];
      if (!doc) return;

      currentDocId = docId;

      // Actualizar botones de menú
      document.querySelectorAll('.menu-item-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`menu-btn-${docId}`);
      if (activeBtn) activeBtn.classList.add('active');

      // Actualizar metadatos
      document.getElementById('doc-category-badge').textContent = doc.category;
      document.getElementById('doc-filename-label').textContent = doc.filename;

      // Procesar alertas de GitHub correctamente
      let processedMd = processGitHubAlerts(doc.content);

      // Parsear Markdown
      const htmlOutput = marked.parse(processedMd);
      const article = document.getElementById('doc-article-body');
      article.innerHTML = htmlOutput;

      // Interceptar enlaces relativos para navegación interna
      article.querySelectorAll('a').forEach(link => {
        const href = link.getAttribute('href');
        if (href && (href.endsWith('.md') || EMBEDDED_DOCS[href])) {
          link.onclick = (e) => {
            e.preventDefault();
            loadDoc(href);
          };
        }
      });

      // Renderizar fórmulas LaTeX con KaTeX
      if (window.renderMathInElement) {
        renderMathInElement(article, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\(', right: '\\)', display: false},
            {left: '\\[', right: '\\]', display: true}
          ],
          throwOnError: false
        });
      }

      // Construir tabla de contenidos de la página
      buildTableOfContents(article);

      // Scroll suave arriba
      document.getElementById('doc-viewport').scrollTop = 0;

      // Actualizar botones paginadores
      updateNavButtons();
    }

    // Procesa las alertas GitHub sin aplanar listas ni enlaces
    function processGitHubAlerts(markdownText) {
      return markdownText.replace(/>\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]([\s\S]*?)(?=(?:\r?\n\s*\r?\n(?!>))|\r?\n\s*$)/gi, function(match, type, rawContent) {
        const t = type.toUpperCase();
        let alertClass = 'alert-note';
        let icon = 'ℹ️';
        let title = 'NOTA';
        if (t === 'TIP') { alertClass = 'alert-tip'; icon = '💡'; title = 'CONSEJO'; }
        else if (t === 'IMPORTANT') { alertClass = 'alert-important'; icon = '🔔'; title = 'IMPORTANTE'; }
        else if (t === 'WARNING') { alertClass = 'alert-warning'; icon = '⚠️'; title = 'ADVERTENCIA'; }
        else if (t === 'CAUTION') { alertClass = 'alert-important'; icon = '🛑'; title = 'PRECAUCIÓN'; }

        // Limpiar prefijo '>' de cada línea
        const cleanContent = rawContent.split('\n').map(l => l.replace(/^>\s?/, '')).join('\n').trim();
        const parsedInner = marked.parse(cleanContent);

        return `\n\n<div class="alert-box ${alertClass}"><div class="alert-header"><span class="alert-icon">${icon}</span><span class="alert-title">${title}</span></div><div class="alert-content">${parsedInner}</div></div>\n\n`;
      });
    }

    function buildTableOfContents(article) {
      const toc = document.getElementById('table-of-contents');
      if (!toc) return;

      const headings = article.querySelectorAll('h2, h3');
      if (headings.length === 0) {
        toc.innerHTML = '<span style="font-size: 0.72rem; color: var(--text-faint); font-style: italic;">Sin subtítulos en esta sección</span>';
        return;
      }

      let html = '';
      headings.forEach((h, idx) => {
        const id = h.id || `section-${idx}`;
        h.id = id;
        const isH3 = h.tagName === 'H3';
        html += `
          <a href="#${id}" onclick="smoothScrollTo('${id}', event)" class="toc-link ${isH3 ? 'h3' : ''}" title="${h.textContent}">
            ${h.textContent}
          </a>
        `;
      });
      toc.innerHTML = html;
    }

    function smoothScrollTo(elementId, e) {
      if (e) e.preventDefault();
      const el = document.getElementById(elementId);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function updateNavButtons() {
      const idx = DOC_ORDER.indexOf(currentDocId);
      const prevBtn = document.getElementById('btn-prev-doc');
      const nextBtn = document.getElementById('btn-next-doc');

      if (idx > 0) {
        prevBtn.style.display = 'inline-flex';
        const prevDoc = EMBEDDED_DOCS[DOC_ORDER[idx - 1]];
        prevBtn.innerHTML = `<span>←</span> ${prevDoc.title}`;
      } else {
        prevBtn.style.display = 'none';
      }

      if (idx < DOC_ORDER.length - 1) {
        nextBtn.style.display = 'inline-flex';
        const nextDoc = EMBEDDED_DOCS[DOC_ORDER[idx + 1]];
        nextBtn.innerHTML = `${nextDoc.title} <span>→</span>`;
      } else {
        nextBtn.style.display = 'none';
      }
    }

    function navPrevDoc() {
      const idx = DOC_ORDER.indexOf(currentDocId);
      if (idx > 0) loadDoc(DOC_ORDER[idx - 1]);
    }

    function navNextDoc() {
      const idx = DOC_ORDER.indexOf(currentDocId);
      if (idx < DOC_ORDER.length - 1) loadDoc(DOC_ORDER[idx + 1]);
    }

    function filterDocuments() {
      const query = document.getElementById('doc-search-input').value.toLowerCase();
      document.querySelectorAll('.menu-item-btn').forEach(btn => {
        const text = btn.textContent.toLowerCase();
        btn.style.display = text.includes(query) ? 'flex' : 'none';
      });
    }

    function copyDocMarkdown() {
      const doc = EMBEDDED_DOCS[currentDocId];
      if (!doc) return;
      navigator.clipboard.writeText(doc.content).then(() => {
        const btn = document.getElementById('btn-copy-doc');
        btn.textContent = "✅ ¡Copiado!";
        setTimeout(() => btn.textContent = "📋 Copiar Markdown", 2000);
      });
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      initDocsReader();
    });
  </script>
</body>
</html>
