<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroGenetica – Documentación Técnica</title>

<!-- Marked.js (Markdown parser) -->
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<!-- KaTeX (math rendering) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"
  onload="renderMathOnLoad()"></script>

<style>
  /* ── Variables de tema ─────────────────────────── */
  :root[data-theme="light"] {
    --bg:          #f4f1eb;
    --bg-sidebar:  #ede9e1;
    --bg-card:     #faf8f4;
    --border:      #d8d2c8;
    --text:        #2c2c2c;
    --text-muted:  #6b6460;
    --text-faint:  #9a918a;
    --accent:      #5a7a5c;
    --accent-soft: #e8f0e8;
    --link:        #3d6b41;
    --code-bg:     #ede9e1;
    --code-border: #c8c2b8;
    --tip-bg:      #eaf3ea;
    --tip-border:  #7aad7e;
    --note-bg:     #eaf0f8;
    --note-border: #7aaad4;
    --warn-bg:     #fdf5e0;
    --warn-border: #d4aa50;
    --caution-bg:  #fdecea;
    --caution-border:#d47a7a;
    --imp-bg:      #f3eafa;
    --imp-border:  #9a7ad4;
    --shadow:      rgba(0,0,0,0.08);
    --toc-active:  #5a7a5c;
  }
  :root[data-theme="dark"] {
    --bg:          #121214;
    --bg-sidebar:  #19191d;
    --bg-card:     #1c1c20;
    --border:      #2e2e34;
    --text:        #e0ddd8;
    --text-muted:  #9a9898;
    --text-faint:  #6a6868;
    --accent:      #7aad7e;
    --accent-soft: #1e2e1e;
    --link:        #8cc48f;
    --code-bg:     #1a1a1e;
    --code-border: #2e2e36;
    --tip-bg:      #172017;
    --tip-border:  #4a7a4e;
    --note-bg:     #141a24;
    --note-border: #4a6a9a;
    --warn-bg:     #24200e;
    --warn-border: #9a7a28;
    --caution-bg:  #24140e;
    --caution-border:#9a4a3e;
    --imp-bg:      #1e162a;
    --imp-border:  #6a4a9a;
    --shadow:      rgba(0,0,0,0.3);
    --toc-active:  #7aad7e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.7;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    transition: background 0.2s, color 0.2s;
  }

  /* ── Header ─────────────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    height: 54px;
    background: var(--bg-sidebar);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    gap: 16px;
  }
  .header-brand {
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.02em;
    color: var(--text);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header-nav {
    display: flex;
    align-items: center;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
    flex: 1;
  }
  .header-nav::-webkit-scrollbar { display: none; }
  .nav-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 0.82rem;
    color: var(--text-muted);
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }
  .nav-btn:hover { background: var(--border); color: var(--text); }
  .nav-btn.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  .header-actions { display: flex; align-items: center; gap: 8px; }
  .theme-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
    font-size: 0.8rem;
    color: var(--text-muted);
    transition: all 0.15s;
    white-space: nowrap;
  }
  .theme-btn:hover { border-color: var(--accent); color: var(--text); }

  /* ── Layout ─────────────────────────────────────── */
  .workspace {
    display: flex;
    flex: 1;
    overflow: hidden;
    height: calc(100vh - 54px);
  }

  /* ── TOC Sidebar ─────────────────────────────────── */
  aside.toc-sidebar {
    width: 220px;
    min-width: 220px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px 0;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  aside.toc-sidebar::-webkit-scrollbar { width: 4px; }
  aside.toc-sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .toc-title {
    padding: 0 16px 8px;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  .toc-link {
    display: block;
    padding: 4px 16px 4px 20px;
    font-size: 0.78rem;
    color: var(--text-muted);
    text-decoration: none;
    border-left: 2px solid transparent;
    transition: all 0.12s;
    line-height: 1.4;
  }
  .toc-link:hover { color: var(--text); background: var(--border); }
  .toc-link.active { border-left-color: var(--toc-active); color: var(--toc-active); background: var(--accent-soft); font-weight: 600; }
  .toc-link.h3 { padding-left: 30px; font-size: 0.74rem; }
  .toc-link.h4 { padding-left: 42px; font-size: 0.72rem; color: var(--text-faint); }

  @media (max-width: 1080px) {
    aside.toc-sidebar { display: none; }
  }

  /* ── Main Content ───────────────────────────────── */
  main.doc-viewport {
    flex: 1;
    overflow-y: auto;
    padding: 36px 56px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  main.doc-viewport::-webkit-scrollbar { width: 6px; }
  main.doc-viewport::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ── Loading / error ────────────────────────────── */
  .loading-msg {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 60vh;
    color: var(--text-faint);
    font-size: 0.9rem;
    gap: 10px;
  }
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Markdown Styles ────────────────────────────── */
  .md-body { max-width: 820px; }

  .md-body h1 {
    font-size: 2rem;
    font-weight: 700;
    margin: 0 0 20px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--border);
    color: var(--text);
    letter-spacing: -0.03em;
  }
  .md-body h2 {
    font-size: 1.35rem;
    font-weight: 700;
    margin: 36px 0 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }
  .md-body h3 { font-size: 1.1rem; font-weight: 600; margin: 24px 0 8px; color: var(--text); }
  .md-body h4 { font-size: 0.95rem; font-weight: 600; margin: 16px 0 6px; color: var(--text-muted); }
  .md-body p { margin: 0 0 14px; }
  .md-body a { color: var(--link); text-decoration: underline; text-underline-offset: 2px; }
  .md-body a:hover { color: var(--accent); }

  .md-body ul, .md-body ol { margin: 0 0 14px 24px; }
  .md-body li { margin: 4px 0; }
  .md-body li > ul, .md-body li > ol { margin-bottom: 0; }

  .md-body hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }

  .md-body table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 0.88rem;
  }
  .md-body th, .md-body td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
    vertical-align: top;
  }
  .md-body th { background: var(--bg-sidebar); font-weight: 600; }
  .md-body tr:nth-child(even) td { background: var(--bg-card); }

  .md-body code {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    border-radius: 4px;
    padding: 1px 5px;
    font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    font-size: 0.84em;
    color: var(--text);
  }
  .md-body pre {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    border-radius: 8px;
    padding: 16px;
    overflow-x: auto;
    margin: 14px 0;
  }
  .md-body pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: 0.85em;
  }
  .md-body kbd {
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 0.8em;
    background: var(--code-bg);
    font-family: inherit;
  }
  .md-body blockquote {
    border-left: 3px solid var(--border);
    padding: 2px 16px;
    margin: 10px 0;
    color: var(--text-muted);
  }
  .md-body img { max-width: 100%; border-radius: 6px; }
  .md-body strong { font-weight: 700; color: var(--text); }

  /* ── GitHub Alert Boxes ────────────────────────── */
  .gh-alert {
    border-radius: 8px;
    padding: 14px 18px;
    margin: 14px 0;
    border-left: 4px solid;
    font-size: 0.9rem;
  }
  .gh-alert .alert-label {
    font-weight: 700;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .gh-alert.tip    { background: var(--tip-bg);     border-color: var(--tip-border);     }
  .gh-alert.note   { background: var(--note-bg);    border-color: var(--note-border);    }
  .gh-alert.warning{ background: var(--warn-bg);    border-color: var(--warn-border);    }
  .gh-alert.caution{ background: var(--caution-bg); border-color: var(--caution-border); }
  .gh-alert.important{ background: var(--imp-bg);   border-color: var(--imp-border);     }

  .gh-alert.tip .alert-label     { color: var(--tip-border);     }
  .gh-alert.note .alert-label    { color: var(--note-border);    }
  .gh-alert.warning .alert-label { color: var(--warn-border);    }
  .gh-alert.caution .alert-label { color: var(--caution-border); }
  .gh-alert.important .alert-label{ color: var(--imp-border);    }
  .gh-alert .alert-body { color: var(--text); }
  .gh-alert .alert-body p:last-child { margin-bottom: 0; }
  .gh-alert .alert-body ul,
  .gh-alert .alert-body ol { margin-bottom: 0; }

  /* ── KaTeX display math ─────────────────────────── */
  .katex-display { overflow-x: auto; padding: 4px 0; }
</style>
</head>
<body>

<header>
  <div class="header-brand">🏎️🧠 NeuroGenetica</div>
  <nav class="header-nav" id="docNav"></nav>
  <div class="header-actions">
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">☀️ Claro</button>
  </div>
</header>

<div class="workspace">
  <aside class="toc-sidebar" id="tocSidebar">
    <div class="toc-title">En esta página</div>
    <div id="tocContent"></div>
  </aside>
  <main class="doc-viewport" id="docViewport">
    <div class="loading-msg"><div class="spinner"></div> Cargando documentación…</div>
  </main>
</div>

<script>
// ── Documentos disponibles ────────────────────────────────────────────────────
// Edita esta lista para agregar o quitar documentos del menú de navegación.
const DOCS = [
  { label: 'README',           file: '../README.md'              },
  { label: 'Arquitectura',     file: 'ARCHITECTURE.md'           },
  { label: 'Estructuras Datos',file: 'DATA_STRUCTURES.md'        },
  { label: 'Física & IA',      file: 'AI_AND_PHYSICS.md'         },
  { label: 'Guía Godot 3D',    file: 'GUIA_GODOT.md'            },
];

// ── Estado ────────────────────────────────────────────────────────────────────
let currentDoc = 0;
let mathReady = false;

// ── KaTeX ─────────────────────────────────────────────────────────────────────
function renderMathOnLoad() { mathReady = true; tryRenderMath(); }
function tryRenderMath() {
  if (!mathReady) return;
  const el = document.getElementById('docViewport');
  if (!el) return;
  renderMathInElement(el, {
    delimiters: [
      { left: '$$', right: '$$', display: true  },
      { left: '$',  right: '$',  display: false },
      { left: '\\(', right: '\\)', display: false },
      { left: '\\[', right: '\\]', display: true  },
    ],
    throwOnError: false,
    output: 'html',
  });
}

// ── Marked.js config ──────────────────────────────────────────────────────────
marked.setOptions({ gfm: true, breaks: false });

// Renderer personalizado: NO re-escapar $ para que KaTeX los procese
const renderer = new marked.Renderer();
renderer.codespan = (code) => {
  const escaped = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<code>${escaped}</code>`;
};

// ── Alert Box Parser ──────────────────────────────────────────────────────────
const ALERT_TYPES = {
  'TIP':       { cls: 'tip',       icon: '💡', label: 'TIP'       },
  'NOTE':      { cls: 'note',      icon: 'ℹ️',  label: 'NOTA'      },
  'WARNING':   { cls: 'warning',   icon: '⚠️',  label: 'ATENCIÓN'  },
  'CAUTION':   { cls: 'caution',   icon: '🚨',  label: 'CUIDADO'   },
  'IMPORTANT': { cls: 'important', icon: '📌',  label: 'IMPORTANTE'},
};

function parseAlerts(html) {
  // Match <blockquote> that starts with [!TYPE]
  return html.replace(
    /<blockquote>\s*<p>\[!(TIP|NOTE|WARNING|CAUTION|IMPORTANT)\]([\s\S]*?)<\/p>\s*<\/blockquote>/gi,
    (_, type, rest) => {
      const def = ALERT_TYPES[type.toUpperCase()];
      if (!def) return _;
      // rest may contain leading <br> or lines; clean up and re-parse as markdown
      const rawInner = rest
        .replace(/^[\s\S]*?\[!(TIP|NOTE|WARNING|CAUTION|IMPORTANT)\]/i, '') // strip type line if duplicated
        .replace(/<br\s*\/?>/gi, '\n')
        .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
      const innerHtml = marked.parse(rawInner.trim(), { renderer });
      return `<div class="gh-alert ${def.cls}">
  <div class="alert-label">${def.icon} ${def.label}</div>
  <div class="alert-body">${innerHtml}</div>
</div>`;
    }
  );
}

// ── Markdown → HTML ───────────────────────────────────────────────────────────
function mdToHtml(md) {
  // Protect math blocks from marked processing
  const mathBlocks = [];
  md = md.replace(/\$\$[\s\S]*?\$\$/g, m => {
    mathBlocks.push(m);
    return `@@MATH${mathBlocks.length - 1}@@`;
  });
  md = md.replace(/(?<![\\])\$(?!\$)([^\n$`]+?)(?<![\\])\$/g, (m) => {
    mathBlocks.push(m);
    return `@@MATH${mathBlocks.length - 1}@@`;
  });

  let html = marked.parse(md, { renderer });

  // Restore math blocks
  html = html.replace(/@@MATH(\d+)@@/g, (_, i) => mathBlocks[+i]);

  // Parse GitHub alert boxes
  html = parseAlerts(html);

  return html;
}

// ── TOC Builder ───────────────────────────────────────────────────────────────
function buildToc(container) {
  const headings = container.querySelectorAll('h1, h2, h3, h4');
  const toc = document.getElementById('tocContent');
  toc.innerHTML = '';
  headings.forEach((h, i) => {
    if (!h.id) h.id = 'h-' + i + '-' + h.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-');
    const a = document.createElement('a');
    a.className = 'toc-link ' + h.tagName.toLowerCase();
    a.href = '#' + h.id;
    a.textContent = h.textContent.replace(/^[^\w\s]+\s*/, '').trim().slice(0, 52);
    a.addEventListener('click', e => {
      e.preventDefault();
      h.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    toc.appendChild(a);
  });

  // Highlight active heading on scroll
  const viewport = document.getElementById('docViewport');
  const tocLinks = toc.querySelectorAll('.toc-link');
  const headingArr = Array.from(headings);
  viewport.onscroll = () => {
    const scrollTop = viewport.scrollTop + 80;
    let active = 0;
    headingArr.forEach((h, i) => { if (h.offsetTop <= scrollTop) active = i; });
    tocLinks.forEach((l, i) => l.classList.toggle('active', i === active));
  };
}

// ── Nav Builder ───────────────────────────────────────────────────────────────
function buildNav() {
  const nav = document.getElementById('docNav');
  nav.innerHTML = '';
  DOCS.forEach((doc, i) => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn' + (i === currentDoc ? ' active' : '');
    btn.textContent = doc.label;
    btn.onclick = () => loadDoc(i);
    nav.appendChild(btn);
  });
}

// ── Load Document ─────────────────────────────────────────────────────────────
async function loadDoc(index) {
  currentDoc = index;
  buildNav();

  const viewport = document.getElementById('docViewport');
  viewport.innerHTML = '<div class="loading-msg"><div class="spinner"></div> Cargando…</div>';
  document.getElementById('tocContent').innerHTML = '';

  const doc = DOCS[index];
  try {
    // Add cache-busting to always get the latest version of the file
    const res = await fetch(doc.file + '?_=' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const md = await res.text();
    const html = mdToHtml(md);
    viewport.innerHTML = `<div class="md-body">${html}</div>`;
    buildToc(viewport.querySelector('.md-body'));
    viewport.scrollTop = 0;
    tryRenderMath();
  } catch(err) {
    viewport.innerHTML = `
      <div class="md-body">
        <div class="gh-alert caution">
          <div class="alert-label">🚨 Error al cargar</div>
          <div class="alert-body">
            <p>No se pudo cargar <strong>${doc.file}</strong>.</p>
            <p><em>${err.message}</em></p>
            <p>Este portal de documentación funciona mejor cuando se sirve desde un servidor local
               (ej. la extensión <strong>Live Server</strong> de VS Code, o
               <code>python -m http.server 8080</code> en la carpeta raíz del proyecto).</p>
          </div>
        </div>
      </div>`;
  }
}

// ── Theme Toggle ─────────────────────────────────────────────────────────────
function toggleTheme() {
  const root = document.documentElement;
  const isDark = root.getAttribute('data-theme') === 'dark';
  root.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = isDark ? '🌙 Oscuro' : '☀️ Claro';
  localStorage.setItem('ngTheme', isDark ? 'light' : 'dark');
}

// ── Init ──────────────────────────────────────────────────────────────────────
(function init() {
  // Restore saved theme
  const saved = localStorage.getItem('ngTheme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themeBtn').textContent = saved === 'dark' ? '☀️ Claro' : '🌙 Oscuro';

  buildNav();
  loadDoc(0);
})();
</script>
</body>
</html>
