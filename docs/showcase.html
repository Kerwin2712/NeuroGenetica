<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroGenetica · Documentación Oficial</title>
  
  <!-- Marked.js para renderizar Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- KaTeX para renderizar fórmulas matemáticas LaTeX ($ y $$) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <style>
    /* VARIABLES DE TEMA: MODO CLARO (PASTEL APERLADO) Y MODO OSCURO (GRISES OSCUROS) */
    :root {
      /* MODO CLARO: Fondo pastel aperlado / marfil suave, letras oscuras */
      --bg-page: #f8f6f0;
      --bg-surface: #ffffff;
      --bg-sidebar: #f3efe6;
      --bg-hover: #ebe5d8;
      --bg-active: #e2dac8;
      --border-color: #e4ddd2;
      --border-strong: #d2c8b8;
      --text-main: #23272f;
      --text-heading: #11141a;
      --text-muted: #626875;
      --text-faint: #8f95a3;
      --brand-primary: #1d4ed8;
      --brand-bg: #e0ecff;
      --brand-border: #b9d5ff;
      --code-bg: #eeeae0;
      --code-border: #ded6c8;
      --code-text: #0369a1;
      --pre-bg: #23272f;
      --pre-text: #f8fafc;
      --table-border: #ded8cb;
      --table-even: #f3efe6;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);

      /* Alertas en modo claro (tonos pastel suaves) */
      --alert-tip-bg: #eefbf3;
      --alert-tip-border: #bbf0cf;
      --alert-tip-text: #14532d;
      --alert-note-bg: #eff6ff;
      --alert-note-border: #bfdbfe;
      --alert-note-text: #1e40af;
      --alert-warning-bg: #fffbeb;
      --alert-warning-border: #fde68a;
      --alert-warning-text: #854d0e;
      --alert-important-bg: #faf5ff;
      --alert-important-border: #e9d5ff;
      --alert-important-text: #6b21a8;
    }

    html.dark {
      /* MODO OSCURO: Tonos de grises oscuros elegantes, sin azules saturados */
      --bg-page: #121214;
      --bg-surface: #18181c;
      --bg-sidebar: #151518;
      --bg-hover: #222228;
      --bg-active: #2a2a32;
      --border-color: #27272e;
      --border-strong: #363640;
      --text-main: #dcdce2;
      --text-heading: #fcfcfd;
      --text-muted: #9595a2;
      --text-faint: #656573;
      --brand-primary: #3b82f6;
      --brand-bg: #1e293b;
      --brand-border: #3b82f644;
      --code-bg: #202026;
      --code-border: #2e2e38;
      --code-text: #38bdf8;
      --pre-bg: #0d0d0f;
      --pre-text: #e2e2e8;
      --table-border: #27272e;
      --table-even: #16161a;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);

      /* Alertas en modo oscuro */
      --alert-tip-bg: rgba(16, 185, 129, 0.08);
      --alert-tip-border: rgba(16, 185, 129, 0.3);
      --alert-tip-text: #6ee7b7;
      --alert-note-bg: rgba(59, 130, 246, 0.08);
      --alert-note-border: rgba(59, 130, 246, 0.3);
      --alert-note-text: #93c5fd;
      --alert-warning-bg: rgba(245, 158, 11, 0.08);
      --alert-warning-border: rgba(245, 158, 11, 0.3);
      --alert-warning-text: #fcd34d;
      --alert-important-bg: rgba(168, 85, 247, 0.08);
      --alert-important-border: rgba(168, 85, 247, 0.3);
      --alert-important-text: #d8b4fe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* BARRA SUPERIOR */
    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
      z-index: 40;
    }
    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .brand-icon {
      font-size: 1.25rem;
    }
    .brand-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-heading);
      letter-spacing: -0.01em;
    }
    .brand-badge {
      font-size: 0.72rem;
      font-weight: 600;
      background: var(--brand-bg);
      color: var(--brand-primary);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid var(--brand-border);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-btn {
      background-color: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .header-btn:hover {
      background-color: var(--bg-hover);
      border-color: var(--border-strong);
    }

    /* CONTENEDOR PRINCIPAL */
    .app-layout {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* SIDEBAR IZQUIERDO */
    aside.sidebar {
      width: 290px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }
    .search-box-wrapper {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
    }
    .search-input {
      width: 100%;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 7px 12px 7px 32px;
      font-size: 0.8rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input:focus {
      border-color: var(--brand-primary);
    }
    .search-icon {
      position: absolute;
      left: 28px;
      top: 22px;
      font-size: 0.8rem;
      color: var(--text-muted);
      pointer-events: none;
    }
    .menu-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px;
    }
    .menu-category-title {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-faint);
      padding: 8px 10px 4px;
    }
    .menu-item-btn {
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
      background: none;
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
      transition: all 0.12s ease;
      font-weight: 500;
    }
    .menu-item-btn:hover {
      background-color: var(--bg-hover);
      color: var(--text-heading);
    }
    .menu-item-btn.active {
      background-color: var(--bg-surface);
      color: var(--brand-primary);
      border-color: var(--border-color);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }
    .menu-item-left {
      display: flex;
      align-items: center;
      gap: 9px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .menu-item-badge {
      font-size: 0.65rem;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--bg-page);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      font-family: ui-monospace, monospace;
      flex-shrink: 0;
    }
    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* CONTENEDOR CENTRAL DE LECTURA */
    main.doc-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 40px 60px;
      background-color: var(--bg-page);
    }
    .doc-container {
      max-width: 820px;
      margin: 0 auto;
    }
    .doc-header-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      padding-bottom: 16px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
    }
    .doc-meta-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .doc-category-pill {
      font-weight: 600;
      color: var(--brand-primary);
      background: var(--brand-bg);
      border: 1px solid var(--brand-border);
      padding: 2px 8px;
      border-radius: 4px;
    }
    .doc-action-links {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .doc-action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
      transition: color 0.15s;
    }
    .doc-action-btn:hover {
      color: var(--text-heading);
    }

    /* ESTILOS PROSE DE LA DOCUMENTACIÓN */
    .prose-body {
      font-size: 0.95rem;
      line-height: 1.75;
      color: var(--text-main);
    }
    .prose-body h1 {
      color: var(--text-heading);
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin: 0 0 1.25rem 0;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
    }
    .prose-body h2 {
      color: var(--text-heading);
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 2.5rem 0 1rem 0;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border-subtle);
    }
    .prose-body h3 {
      color: var(--text-heading);
      font-size: 1.18rem;
      font-weight: 600;
      margin: 1.75rem 0 0.75rem 0;
    }
    .prose-body h4 {
      color: var(--text-heading);
      font-size: 1rem;
      font-weight: 600;
      margin: 1.25rem 0 0.5rem 0;
    }
    .prose-body p {
      margin-bottom: 1.15rem;
    }
    .prose-body ul, .prose-body ol {
      padding-left: 1.6rem;
      margin-bottom: 1.25rem;
    }
    .prose-body li {
      margin-bottom: 0.4rem;
    }
    .prose-body strong {
      color: var(--text-heading);
      font-weight: 600;
    }
    .prose-body a {
      color: var(--brand-primary);
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight: 500;
      cursor: pointer;
    }
    .prose-body a:hover {
      opacity: 0.85;
    }
    .prose-body code:not(pre code) {
      background-color: var(--code-bg);
      color: var(--code-text);
      padding: 0.15rem 0.45rem;
      border-radius: 5px;
      font-size: 0.85em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      border: 1px solid var(--code-border);
    }
    .prose-body pre {
      background-color: var(--pre-bg);
      color: var(--pre-text);
      border-radius: 10px;
      padding: 1.1rem 1.3rem;
      overflow-x: auto;
      margin: 1.35rem 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.6;
      border: 1px solid var(--border-color);
    }
    .prose-body blockquote {
      border-left: 4px solid var(--brand-primary);
      background-color: var(--bg-surface);
      padding: 0.75rem 1.2rem;
      margin: 1.25rem 0;
      border-radius: 0 8px 8px 0;
      color: var(--text-muted);
      border-top: 1px solid var(--border-subtle);
      border-right: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
    }
    .prose-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 0.88rem;
    }
    .prose-body th {
      background-color: var(--bg-surface);
      color: var(--text-heading);
      text-align: left;
      padding: 0.75rem 1rem;
      border: 1px solid var(--table-border);
      font-weight: 600;
    }
    .prose-body td {
      padding: 0.65rem 1rem;
      border: 1px solid var(--table-border);
      background-color: var(--bg-surface);
    }
    .prose-body tr:nth-child(even) td {
      background-color: var(--table-even);
    }
    .prose-body hr {
      border: 0;
      border-top: 1px solid var(--border-color);
      margin: 2.25rem 0;
    }

    /* TARJETAS DE ALERTAS GITHUB PARSEADAS CON FORMATO COMPLETO */
    .alert-box {
      border-radius: 10px;
      padding: 14px 18px;
      margin: 1.4rem 0;
      border-width: 1px;
      border-style: solid;
      box-shadow: var(--shadow-sm);
    }
    .alert-box .alert-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .alert-box .alert-icon {
      font-size: 1rem;
    }
    .alert-box .alert-content {
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .alert-box .alert-content p:last-child {
      margin-bottom: 0;
    }
    .alert-box .alert-content ul, .alert-box .alert-content ol {
      margin-bottom: 0.5rem;
    }
    
    .alert-tip {
      background-color: var(--alert-tip-bg);
      border-color: var(--alert-tip-border);
      color: var(--alert-tip-text);
    }
    .alert-note {
      background-color: var(--alert-note-bg);
      border-color: var(--alert-note-border);
      color: var(--alert-note-text);
    }
    .alert-warning {
      background-color: var(--alert-warning-bg);
      border-color: var(--alert-warning-border);
      color: var(--alert-warning-text);
    }
    .alert-important {
      background-color: var(--alert-important-bg);
      border-color: var(--alert-important-border);
      color: var(--alert-important-text);
    }

    /* NAVEGACIÓN INFERIOR (PAGINADOR) */
    .doc-pager {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .pager-btn {
      padding: 10px 18px;
      border-radius: 8px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
      text-decoration: none;
      box-shadow: var(--shadow-sm);
    }
    .pager-btn:hover {
      background-color: var(--bg-hover);
      border-color: var(--border-strong);
      color: var(--text-heading);
    }

    /* SIDEBAR DERECHO: ÍNDICE DE SECCIÓN */
    aside.toc-sidebar {
      width: 240px;
      background-color: var(--bg-sidebar);
      border-left: 1px solid var(--border-color);
      padding: 24px 18px;
      overflow-y: auto;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    .toc-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-faint);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toc-link {
      display: block;
      font-size: 0.78rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 5px 0;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.12s;
    }
    .toc-link:hover {
      color: var(--brand-primary);
    }
    .toc-link.h3 {
      padding-left: 12px;
      font-size: 0.74rem;
      color: var(--text-faint);
    }

    @media (max-width: 1080px) {
      aside.toc-sidebar {
        display: none;
      }
      main.doc-viewport {
        padding: 24px 30px;
      }
    }
    @media (max-width: 768px) {
      aside.sidebar {
        display: none;
      }
      main.doc-viewport {
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>

  <!-- ========================================== -->
  <!-- BARRA DE NAVEGACIÓN SUPERIOR               -->
  <!-- ========================================== -->
  <header>
    <div class="brand-box">
      <span class="brand-icon">🏎️</span>
      <span class="brand-title">NeuroGenetica</span>
      <span class="brand-badge">Docs Oficiales</span>
    </div>

    <div class="header-actions">
      <!-- SELECTOR DE TEMA CLARO / OSCURO -->
      <button onclick="toggleTheme()" id="btn-theme-toggle" class="header-btn" title="Alternar Modo Claro / Oscuro">
        <span id="theme-icon">☀️</span>
        <span id="theme-label" class="font-mono">Modo Claro</span>
      </button>

      <!-- PANTALLA COMPLETA -->
      <button onclick="toggleFullscreen()" class="header-btn" title="Pantalla Completa (F11)">
        <span>⛶</span> F11
      </button>

      <!-- GITHUB LINK -->
      <a href="https://github.com/Kerwin2712/NeuroGenetica" target="_blank" class="header-btn">
        <span>GitHub</span> ↗
      </a>
    </div>
  </header>

  <!-- ========================================== -->
  <!-- CONTENEDOR PRINCIPAL: SIDEBAR + LECTOR     -->
  <!-- ========================================== -->
  <div class="app-layout">
    
    <!-- SIDEBAR IZQUIERDO: ÍNDICE DE DOCUMENTACIÓN -->
    <aside class="sidebar">
      <div class="search-box-wrapper" style="position: relative;">
        <span class="search-icon">🔍</span>
        <input type="text" id="doc-search-input" oninput="filterDocuments()" placeholder="Buscar temas o palabras..." class="search-input">
      </div>

      <nav id="doc-menu-container" class="menu-scroll">
        <!-- Inyectado dinámicamente -->
      </nav>

      <div class="sidebar-footer">
        <span>Programación 3</span>
        <span style="font-family: monospace; font-weight: 600;">ULA · 2026</span>
      </div>
    </aside>

    <!-- ÁREA DE LECTURA DE DOCUMENTO -->
    <main id="doc-viewport" class="doc-viewport">
      <div class="doc-container">
        <!-- Metadatos de cabecera -->
        <div class="doc-header-meta">
          <div class="doc-meta-left">
            <span id="doc-category-badge" class="doc-category-pill">General</span>
            <span>/</span>
            <span id="doc-filename-label" style="font-family: monospace;">README.md</span>
          </div>
          <div class="doc-action-links">
            <button onclick="window.print()" class="doc-action-btn">🖨️ Imprimir</button>
            <span>•</span>
            <button onclick="copyDocMarkdown()" id="btn-copy-doc" class="doc-action-btn">📋 Copiar Markdown</button>
          </div>
        </div>

        <!-- Artículo de contenido parseado -->
        <article id="doc-article-body" class="prose-body">
          <!-- Contenido renderizado aquí -->
        </article>

        <!-- Botones anterior / siguiente -->
        <div class="doc-pager">
          <button id="btn-prev-doc" onclick="navPrevDoc()" class="pager-btn">
            <span>←</span> Anterior
          </button>
          <button id="btn-next-doc" onclick="navNextDoc()" class="pager-btn">
            Siguiente <span>→</span>
          </button>
        </div>
      </div>
    </main>

    <!-- SIDEBAR DERECHO: ÍNDICE DE LA PÁGINA ("ON THIS PAGE") -->
    <aside class="toc-sidebar">
      <div class="toc-title">
        <span>📑</span> En esta página
      </div>
      <nav id="table-of-contents">
        <!-- Enlaces a secciones generados automáticamente -->
      </nav>
    </aside>

  </div>

  <!-- ========================================== -->
  <!-- SCRIPTS Y DATOS EMBEBIDOS                  -->
  <!-- ========================================== -->
  <script>
    // DOCUMENTOS OFICIALES EMBEBIDOS (SIN CORS, FUNCIONA AL 100% OFFLINE)
    const EMBEDDED_DOCS = {"docs_readme": {"id": "docs_readme", "filename": "README.md", "title": "Visión General & Propuesta", "icon": "🏠", "category": "General", "badge": "Core", "content": "# 📚 Documentación Técnica de NeuroGenetica\n\nBienvenido al centro de documentación técnica y arquitectónica de **NeuroGenetica**. Este conjunto de documentos detalla en profundidad el diseño de software, la experiencia de juego, los algoritmos matemáticos y las estructuras de datos avanzadas implementadas para la materia *Programación 3*.\n\n---\n\n## 🎬 Recursos para Exposición y Grabación de Video\n\n> [!TIP]\n> **¿Deseas presentar el proyecto de forma interactiva en video?**  \n> Para grabar tu presentación con OBS Studio o Loom de forma profesional:\n> - 🖥️ **Visualizador Dinámico en Pantalla Completa**: Abre **[`docs/showcase.html`](showcase.html)** en tu navegador web y pulsa <kbd>F11</kbd>. Presenta diapositivas limpias (1080p sin texto distractor), simulador de QuadTree en Canvas 2D, red neuronal con sliders y árbol animado de Max-Heap.\n> - 📄 **Guion Narrativo Separado (Teleprompter / Script)**: Consulta **[`docs/GUION_VIDEO.md`](GUION_VIDEO.md)** en tu teléfono, tablet o segundo monitor con las intervenciones sugeridas por integrante (Rafael, Javier y Kerwin), tiempos cronometrados y acciones paso a paso.\n\n---\n\n## 🗺️ Mapa de Navegación\n\n| Documento | Descripción | Temas Clave |\n| :--- | :--- | :--- |\n| **[Showcase Dinámico (HTML)](showcase.html)** | Interfaz web interactiva en 1080p para captura de video y demostración en vivo. | Canvas QuadTree $O(\\log n)$, Red Neuronal animada y Max-Heap $O(k \\log n)$. |\n| **[Guion de Video (Markdown)](GUION_VIDEO.md)** | Guion técnico y narrativo detallado por integrantes para grabar el video. | Tiempos cronometrados, locución exacta por integrante y consejos OBS. |\n| **[Arquitectura de Software y Archivos](ARCHITECTURE.md)** | Visión integral de capas, componentes y árbol del repositorio. | Módulos Core, AI, Graphics, ciclo de vida del frame, flujo de datos. |\n| **[Estructuras de Datos Avanzadas](DATA_STRUCTURES.md)** | Análisis teórico y práctico de los árboles y colas de prioridad. | QuadTree 2D, SpatialTree3D, Max-Heap, optimización de sensores, análisis de complejidad $O$. |\n| **[Física, Red Neuronal y Neuroevolución](AI_AND_PHYSICS.md)** | Fundamentos matemáticos del simulador y del aprendizaje autónomo. | Cinemática, Raycasting optimizado, ANN Feedforward, fitness, cruce y mutación. |\n| **[Guía de Simulación 3D (Godot 4)](GUIA_GODOT.md)** | Manual de usuario y arquitectura del simulador tridimensional. | Modos Copa/Espectador, cámaras GTA/Isométrica, controles, telemetría y ejecución. |\n\n---\n\n## 🎯 Propuesta Actualizada del Proyecto (Programación 3)\n\n**Título:** *Desarrollo de un Videojuego de Carreras en C++ con Rivales de Inteligencia Artificial Adaptativa*.\n\n1. **Experiencia de Juego de Carreras (Objetivo Principal)**:\n   - Videojuego interactivo en circuitos cerrados donde el jugador humano compite en tiempo real contra múltiples rivales controlados por IA, garantizando fluidez competitiva a 60 FPS.\n2. **Modos de Juego (Gamificación)**:\n   - **Modo Copa**: Torneo multironda en circuitos cerrados donde los rivales acumulan puntuación y refinan sus genomas entre carreras.\n   - **Carrera Única**: Partida rápida contra el mejor modelo histórico entrenado o rivales pre-calibrados.\n   - **Carretera Vertical (Endless)**: Supervivencia en autopista esquivando tráfico con rivales IA reactivos.\n   - **Diferenciación Visual**: Rivales identificables por color (Azul Neón = Jugador, Verde/Oro = Líder Élite, Púrpura/Naranja = Rivales en aprendizaje).\n   - **Soporte Multijugador Local**: Competencia 1v1 en el mismo teclado (WASD vs Flechas) o cooperativo contra la parrilla de IA.\n3. **Evolución de Rivales (IA Adaptativa)**:\n   - Redes neuronales feedforward y algoritmos genéticos continuos que permiten a los coches rivales aprender a trazar curvas y adaptarse sin requerir rutas precalculadas (*waypoints* fijos) ni trampas.\n4. **Optimización de Físicas y Rendimiento (Estructuras de Datos)**:\n   - **QuadTree ($O(\\log n)$)**: Indexación espacial 2D de los segmentos de la pista para acelerar el raycasting de sensores y las colisiones de toda la parrilla.\n   - **Max-Heap ($O(k \\log n)$)**: Ranking y extracción instantánea del top-$k$ de mejores corredores para elitismo y cruce genético sin caídas de cuadros por segundo.\n5. **Arquitectura Limpia en C++17**:\n   - Programación Orientada a Objetos modular, pruebas unitarias automatizadas con **CTest** y flujo de trabajo estructurado en Git.\n"}, "README.md": "root_readme", "root_readme": {"id": "root_readme", "filename": "INSTALL.md", "title": "Guía de Inicio y Requisitos", "icon": "⚙️", "category": "General", "badge": "Inicio", "content": "# NeuroGenetica 🏎️🧠\n\n**Videojuego de Carreras en C++ con Rivales de Inteligencia Artificial Adaptativa**, desarrollado en **C++17** con la biblioteca gráfica **Raylib**, optimizado con estructuras de datos avanzadas (**QuadTree** para aceleración espacial y **Max-Heap** para selección elitista). Proyecto desarrollado para la materia *Programación 3*.\n\n> [!TIP]\n> 🎬 **Recursos para Exposición y Grabación de Video**:  \n> - 🖥️ **Visualizador Dinámico**: Abre **[`docs/showcase.html`](docs/showcase.html)** en tu navegador web para proyectar diapositivas limpias en 1080p, el simulador de QuadTree en Canvas 2D en tiempo real, el visualizador animado de la Red Neuronal y el árbol de Max-Heap.\n> - 📄 **Guion Narrativo para Video**: Consulta **[`docs/GUION_VIDEO.md`](docs/GUION_VIDEO.md)** en tu móvil o pantalla secundaria con las intervenciones cronometradas por integrante (Rafael, Javier y Kerwin).\n\n---\n\n## 🎯 Objetivos del Proyecto (Propuesta Programación 3)\n\n1. **Experiencia de Juego de Carreras (Objetivo Principal)**:\n   - Desarrollar un videojuego interactivo de carreras en circuitos cerrados donde el jugador humano compita en tiempo real contra múltiples rivales controlados por IA, garantizando jugabilidad fluida, competitiva y desafiante a 60 FPS.\n2. **Modos de Juego (Gamificación)**:\n   - Control manual del vehículo para enfrentarse en uno o más escenarios contra modelos de IA diferenciables por color o junto a otro jugador en cooperativo/1v1 local.\n   - Soporte de modalidades:\n     - 🏆 **Modo Copa**: Torneo multironda en circuitos cerrados con rivales que refinan sus genomas tras cada carrera.\n     - 🏁 **Carrera Única**: Competencia rápida contra la mejor IA entrenada históricamente o rivales pre-calibrados.\n     - 🛣️ **Carretera Vertical (Endless)**: Supervivencia en autopista con tráfico reactivo y rivales adaptativos.\n3. **Evolución de Rivales (IA Adaptativa)**:\n   - Dotar a los vehículos enemigos de la capacidad de aprender a trazar curvas y conducir dinámicamente mediante Redes Neuronales Feedforward y Algoritmos Genéticos continuos sin atajos precalculados ni trampas.\n4. **Optimización de Físicas y Rendimiento (Estructuras de Datos Avanzadas)**:\n   - **Árboles de Partición Espacial (QuadTree 2D y SpatialTree3D)**: Almacenan los segmentos y límites de la pista en jerarquías AABB para optimizar la comprobación de límites y el raycasting de sensores en tiempo **$O(\\log n)$** en lugar de iteraciones exhaustivas $O(n \\times m)$.\n   - **Max-Heap (Cola de Prioridad)**: Ordenamiento y selección extremadamente veloz del top de competidores por fitness para cruce, podio y elitismo en **$O(k \\log n)$** sin pausar los FPS del juego.\n5. **Arquitectura de Software (POO)**:\n   - Diseño modular, desacoplado y limpio en C++17, separando la lógica del juego, el motor físico y el renderizado visual con pruebas unitarias (**CTest**).\n\n---\n\n## 🎮 Controles de la Simulación\n\n| Tecla / Control | Acción | Descripción |\n| :--- | :---: | :--- |\n| **`W` / `A` / `S` / `D`** o **`Flechas`** | Conducir vehículo | Permite acelerar, frenar y virar manualmente en Modo Manual. |\n| **`M`** | Alternar Modo IA / Manual | Cambia entre conducción manual del usuario y la simulación genética autónoma. |\n| **`Espacio`** | Velocidad de simulación | Alterna la velocidad entre **$\\times 1$**, **$\\times 2$** y **$\\times 5$** para acelerar el entrenamiento. |\n| **`Q`** | Depuración de QuadTree | Activa/desactiva la visualización en pantalla de las subdivisiones del árbol espacial. |\n| **`R`** | Forzar nueva generación | Reinicia inmediatamente la generación actual para descartar individuos estancados. |\n| **`ESC`** | Salir | Cierra la ventana y finaliza la simulación. |\n\n---\n\n## ⚙️ Arquitectura del Sistema\n\n```\n                        ┌───────────────────────────────────┐\n                        │           Engine / Main           │\n                        └─────────────────┬─────────────────┘\n                                          │\n                  ┌───────────────────────┼───────────────────────┐\n                  ▼                       ▼                       ▼\n        ┌──────────────────┐    ┌──────────────────┐    ┌──────────────────┐\n        │      Track       │    │    Population    │    │     Renderer     │\n        │ - QuadTree       │    │ - GeneticAlg     │    │ - Raylib Window  │\n        │ - Checkpoints    │    │ - Max-Heap Rank  │    │ - HUD & Stats    │\n        └─────────┬────────┘    └─────────┬────────┘    └──────────────────┘\n                  │                       │\n                  │              ┌────────┴────────┐\n                  ▼              ▼                 ▼\n          ┌───────────────┐ ┌───────────────┐ ┌───────────────┐\n          │   QuadTree    │ │      Car      │ │ NeuralNetwork │\n          │ (Partición    │ │ - Sensores    │ │ - Capas       │\n          │  espacial 2D) │ │ - Cinemática  │ │ - Pesos/Biases│\n          └───────────────┘ └───────────────┘ └───────────────┘\n```\n\n### Componentes Clave\n\n1. **`Car` (Vehículo)**: Cinemática 2D con aceleración, fricción y viraje angular. Proyecta 5 rayos de sensores normalizados $[0, 1]$ hacia los límites del circuito.\n2. **`NeuralNetwork` (Red Neuronal)**: Arquitectura Feedforward con capas densas y activación no lineal Tanh. Entradas: distancias de sensores + velocidad. Salidas: ángulo de giro y aceleración/freno.\n3. **`GeneticAlgorithm` (Neuroevolución)**: Administra la población de agentes, evalúa el fitness mediante avance ordenado por checkpoints y genera nuevas generaciones usando selección elitista por Max-Heap, crossover y mutación gaussiana.\n4. **`QuadTree` (Árbol Espacial 2D)**: Subdivide espacialmente el plano para reducir drásticamente el espacio de búsqueda en las intersecciones de rayos y colisiones.\n5. **`Track` (Pista y Checkpoints)**: Trazado de alta complejidad con splines Catmull-Rom, pianos bicolores y una secuencia estricta de 69 checkpoints anti-trampas.\n6. **`HUD` (Telemetría e Interfaz)**: Métricas en vivo (generación actual, autos vivos, mejor fitness histórico, telemetría y FPS).\n\n> [!NOTE]\n> Para una descripción exhaustiva de cada archivo del proyecto, diagramas de módulos y análisis formal de complejidades asintóticas para la materia *Programación 3*, consulte la carpeta de **[Documentación Técnica en docs/](docs/README.md)**:\n> - 🎬 **[Showcase Dinámico (HTML)](docs/showcase.html)**\n> - 📄 **[Guion de Video por Integrante](docs/GUION_VIDEO.md)**\n> - 🏛️ **[Arquitectura y Organización de Archivos](docs/ARCHITECTURE.md)**\n> - 🌳 **[Estructuras de Datos Avanzadas (QuadTree y Max-Heap)](docs/DATA_STRUCTURES.md)**\n> - 🧠 **[Física, Redes Neuronales y Neuroevolución](docs/AI_AND_PHYSICS.md)**\n\n---\n\n## 📋 Requerimientos Previos (Requirements)\n\nAntes de compilar, asegúrese de contar con los siguientes programas instalados en su sistema operativo.\n\n### Requisitos Mínimos Generales\n- **Compilador de C++**: Compatible con **C++17** o superior (GCC 9+, Clang 10+ o MSVC 2019+).\n- **CMake**: Versión **3.15** o superior.\n- **Git**: Para clonar el repositorio y descargar automáticamente las dependencias.\n- **Conexión a Internet**: En la primera compilación, CMake descargará automáticamente la librería gráfica [Raylib 5.5](https://www.raylib.com/) mediante `FetchContent`.\n\n---\n\n### 🪟 Instalación de Requerimientos en Windows\n\nPuede instalar todas las herramientas en Windows de dos formas:\n\n#### Opción A: Vía Windows Package Manager (`winget` - Recomendada)\nAbra una terminal de **PowerShell** como Administrador y ejecute:\n\n```powershell\n# Instalar Git y CMake\nwinget install --id Git.Git -e\nwinget install --id Kitware.CMake -e\n\n# Instalar MinGW-w64 (GCC/G++ y Make) mediante MSYS2\nwinget install --id MSYS2.MSYS2 -e\n```\n\nUna vez instalado MSYS2, abra la consola **MSYS2 UCRT64** y ejecute:\n```bash\npacman -S --needed base-devel mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja\n```\n*Asegúrese de agregar `C:\\msys64\\ucrt64\\bin` a las Variables de Entorno del sistema (`PATH`).*\n\n#### Opción B: Con Visual Studio (MSVC)\nSi prefiere el entorno de Microsoft:\n1. Descargue [Visual Studio Community](https://visualstudio.microsoft.com/es/vs/community/).\n2. En el instalador, marque la casilla **\"Desarrollo para el escritorio con C++\"** (incluye compilador MSVC, CMake y Ninja).\n\n---\n\n### 🐧 Instalación de Requerimientos en Linux\n\n> [!IMPORTANT]\n> En distribuciones Linux, la librería gráfica **Raylib** compila directamente desde el código fuente y requiere las cabeceras de desarrollo de X11, OpenGL y ALSA. Debe instalarlas previamente según su distribución:\n\n#### Debian / Ubuntu / Linux Mint\nAbra una terminal y ejecute:\n```bash\nsudo apt update\nsudo apt install -y build-essential cmake git \\\n    libasound2-dev libx11-dev libxrandr-dev libxi-dev \\\n    libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \\\n    libxinerama-dev libwayland-dev libxkbcommon-dev\n```\n\n#### Fedora / RHEL\n```bash\nsudo dnf install -y gcc-c++ cmake git \\\n    mesa-libGL-devel libX11-devel libXrandr-devel libXi-devel \\\n    libXcursor-devel libXinerama-devel alsa-lib-devel\n```\n\n#### Arch Linux / Manjaro\n```bash\nsudo pacman -S --needed base-devel cmake git \\\n    libx11 libxrandr libxi libxcursor libxinerama mesa alsa-lib\n```\n\n---\n\n## 🔨 Compilación desde la Fuente (Building from Source)\n\nSiga estos pasos desde su terminal (PowerShell en Windows o Bash en Linux):\n\n### 1. Clonar el repositorio\n```bash\ngit clone https://github.com/Kerwin2712/NeuroGenetica.git\ncd NeuroGenetica\n```\n\n### 2. Configurar el proyecto con CMake\nCrea la carpeta `build/` y genera los archivos de construcción correspondientes:\n\n- **En Windows (con MinGW Makefiles)**:\n  ```powershell\n  cmake -B build -G \"MinGW Makefiles\"\n  ```\n- **En Windows (con Visual Studio / MSVC)**:\n  ```powershell\n  cmake -B build\n  ```\n- **En Linux**:\n  ```bash\n  cmake -B build\n  ```\n\n### 3. Compilar el proyecto\nConstruye el ejecutable principal y las suites de pruebas unitarias:\n\n- **En Windows**:\n  ```powershell\n  cmake --build build\n  ```\n- **En Linux (compilación en paralelo)**:\n  ```bash\n  cmake --build build --parallel\n  ```\n\n---\n\n## 🚀 Ejecución\n\n### Ejecutar la Simulación Principal\n\n- **En Windows**:\n  ```powershell\n  .\\build\\NeuroGenetica.exe\n  ```\n- **En Linux**:\n  ```bash\n  ./build/NeuroGenetica\n  ```\n\n---\n\n## 🧪 Ejecución de Pruebas Unitarias (Tests)\n\nEl proyecto cuenta con suites de pruebas unitarias exhaustivas que validan la correctitud algorítmica y matemática antes del renderizado.\n\n### Método 1: Automatizado vía CTest (Recomendado)\nDesde la raíz del repositorio, ejecute:\n\n```bash\nctest --test-dir build --output-on-failure\n```\n*Salida esperada:*\n```\n1/3 Test #1: QuadTreeTests ....................   Passed\n2/3 Test #2: NeuralNetworkTests ...............   Passed\n3/3 Test #3: GeneticAlgorithmTests ............   Passed\n100% tests passed out of 3\n```\n\n### Método 2: Ejecución individual por módulo\n\n- **En Windows**:\n  ```powershell\n  # 1. Pruebas de partición espacial 2D e intersecciones\n  .\\build\\QuadTreeTests.exe\n\n  # 2. Pruebas de Feedforward, activaciones y mutación\n  .\\build\\NeuralNetworkTests.exe\n\n  # 3. Pruebas de Max-Heap, elitismo y ciclo generativo\n  .\\build\\GeneticAlgorithmTests.exe\n  ```\n\n- **En Linux**:\n  ```bash\n  ./build/QuadTreeTests\n  ./build/NeuralNetworkTests\n  ./build/GeneticAlgorithmTests\n  ```\n\n---\n\n## 👥 Equipo de Desarrollo y Estado del Proyecto\n\nProyecto desarrollado para la materia **Programación 3**:\n\n### 🏎️ Integrantes y Aportes Realizados (Según Commits)\n\n- **Javier Olivieri**:\n  - Implementación del sistema de cámara dinámica vehicular en Raylib (`feature/camara`).\n  - Posicionamiento ergonómico del HUD en modo de conducción manual.\n  - Calibración de la física cinemática de viraje y sistema de colisiones 2D.\n  - Pruebas unitarias de partición espacial: `test_quadtree.cpp`.\n\n- **Kerwin Quintero**:\n  - Implementación de la Red Neuronal Feedforward (`NeuralNetwork`), capas densas y activación $\\tanh$.\n  - Estructura de datos avanzada **Max-Heap** (Cola de Prioridad) en C++ y GDScript para ranking y selección de élite en tiempo $O(k \\log n)$.\n  - Motor de neuroevolución continua con cruce uniforme y mutación gaussiana.\n  - Integración del motor 3D en **Godot 4** mediante librería **GDExtension C++** (`GodotBrain`).\n  - Estructura de datos avanzada **`SpatialTree3D`** (árbol espacial AABB 3D) con consultas logarítmicas $O(\\log P)$ y visualización de cuadrantes (`Tecla Q`).\n  - Optimización matemática de sensores: distancias al cuadrado ($d^2$), eliminación de raíces cuadradas intermedias y multiplicación por recíproco.\n  - Lógica del juego 3D: menú de inicio, semáforo de largada countdown, podio de Copa, escuderías rivales y telemetría en tiempo real.\n  - Desarrollo del portal web interactivo oficial de documentación técnica y corrección integral de especificaciones Markdown.\n\n- **Rafael Hernandez**:\n  - Diseño conceptual de la experiencia de carreras, gamificación y propuesta de modos competitivos (Modo Copa, Carrera Única, Carretera Vertical).\n  - Trazado de circuitos de Gran Premio con splines cúbicos Catmull-Rom, pianos bicolores y secuencia estricta de 69 checkpoints anti-trampas.\n  - Interfaz de telemetría y HUD central en el infield para monitoreo a 60 FPS.\n  - Estructuración del guion y cronograma de defensa técnica del proyecto.\n\n---\n\n### 📋 Tareas para Terminar Esta Semana\n\n1. 🎬 **Grabación y Montaje del Video de Defensa (5 a 7 min)**:\n   - Seguir las intervenciones cronometradas por integrante en [`docs/GUION_VIDEO.md`](docs/GUION_VIDEO.md).\n   - Capturar demostraciones en vivo de la simulación 2D en Raylib, la simulación 3D en Godot y la terminal de CTest.\n2. 🧪 **Validación Final de Pruebas Unitarias**:\n   - Comprobar que el 100% de las suites de prueba (`QuadTreeTests`, `NeuralNetworkTests`, `GeneticAlgorithmTests`) pasen con éxito con CTest.\n3. 🏁 **Sincronización y Cierre de Ramas**:\n   - Fusionar la rama de trabajo `feature/optimizacion-sensores-estructuras-3d` en `development` y finalmente consolidar la versión final en `main`.\n\n---\n\n### 💡 Ideas Adicionales y Mejoras Futuras (Opcionales)\n\n- 🔊 **Efectos de Audio y Sonido del Motor**:\n  - Incorporar efectos de sonido reactivos a las RPM del motor, derrapes en curvas y pitidos del semáforo de salida.\n- 💾 **Exportación / Importación de Cerebros en JSON**:\n  - Permitir a los jugadores guardar y cargar archivos de cerebros entrenados para compartir modelos de IA entre compañeros.\n- 📈 **Gráfico de Evolución de Fitness en Pantalla**:\n  - Dibujar una gráfica en tiempo real que muestre la curva de aprendizaje de las mejores IAs a través de las generaciones.\n- 🌧️ **Condiciones Climáticas Dinámicas (Lluvia y Asfalto Mojado)**:\n  - Variar el coeficiente de fricción ($\\mu$) dinámicamente durante la carrera para evaluar la adaptabilidad de las redes neuronales ante pérdida de adherencia.\n\n---\n\n### 🎓 Reconocimientos Académicos\n- **Docente**: Prof. Alejandro Mujica\n- **Preparadores**: Jesús León y Sarai Rojas\n\n---\n\n## 🌿 Flujo de Trabajo en Git\n\nEl desarrollo del proyecto se rige bajo la convención de ramas:\n\n```\nfeature/nueva-funcionalidad  ──► (merge) ──┐\n                                           ▼\n                                      development ──► (merge cuando es estable) ──► main (versión final)\n```\n\n1. **`main`**: Rama protegida que contiene únicamente versiones estables, compilables y listas para entrega. No se realizan commits directos sobre ella.\n2. **`development`**: Rama integradora donde convergen todas las características probadas.\n3. **`feature/*`**: Ramas de trabajo individuales para cada componente antes de ser integradas a `development`.\n"}, "INSTALL.md": "root_readme", "architecture": {"id": "architecture", "filename": "ARCHITECTURE.md", "title": "Arquitectura y Módulos", "icon": "🏛️", "category": "Arquitectura", "badge": "POO", "content": "# 🏛️ Arquitectura de Software y Organización de Archivos\n\nEste documento describe la arquitectura modular, los patrones de diseño y la estructura completa de archivos que conforman el proyecto **NeuroGenetica**.\n\n---\n\n## 📐 Visión General de la Arquitectura\n\nEl sistema está diseñado bajo una arquitectura modular en **C++17**, aplicando el principio de **Responsabilidad Única (SRP)** y un desacoplamiento estricto entre la lógica de simulación, las estructuras de datos, la inteligencia artificial y el renderizado gráfico.\n\n```\n                                 ┌──────────────┐\n                                 │   main.cpp   │\n                                 └──────┬───────┘\n                                        │\n                                        ▼\n                               ┌─────────────────┐\n                               │   Simulation    │  (Orquestador Principal)\n                               └────────┬────────┘\n                                        │\n         ┌──────────────────────────────┼──────────────────────────────┐\n         ▼                              ▼                              ▼\n  ┌─────────────┐               ┌───────────────┐               ┌─────────────┐\n  │  Capa Core  │               │    Capa AI    │               │Capa Graphics│\n  │ (Física y   │               │ (Aprendizaje  │               │ (Raylib y   │\n  │  Geometría) │               │   Genético)   │               │  Interfaz)  │\n  └──────┬──────┘               └───────┬───────┘               └──────┬──────┘\n         │                              │                              │\n  ┌──────┴──────────────┐        ┌──────┴──────────────┐               │\n  │ - Geometry.hpp      │        │ - NeuralNetwork     │               ▼\n  │ - QuadTree (Árbol)  │        │ - GeneticAlgorithm  │        ┌─────────────┐\n  │ - Track (Circuito)  │        │ - MaxHeap (Priority)│        │ - HUD.hpp   │\n  │ - Car (Cinemática)  │        └─────────────────────┘        │ - Raylib GL │\n  └─────────────────────┘                                       └─────────────┘\n```\n\n---\n\n## 📂 Árbol de Directorios y Responsabilidades\n\n```\nNeuroGenetica/\n├── CMakeLists.txt                # Configuración de CMake, FetchContent (Raylib) y CTest\n├── README.md                     # Guía principal de compilación y ejecución rápida\n├── .gitignore                    # Reglas de exclusión para binarios, build/ y temporales\n│\n├── docs/                         # Documentación técnica y académica detallada\n│   ├── README.md                 # Índice y mapa de navegación de la documentación\n│   ├── ARCHITECTURE.md           # Arquitectura de software, capas y árbol de archivos\n│   ├── DATA_STRUCTURES.md        # Documentación de QuadTree y MaxHeap con complejidades\n│   └── AI_AND_PHYSICS.md         # Fundamentos de cinemática, raycasting y neuroevolución\n│\n├── include/                      # Declaraciones y cabeceras (.hpp)\n│   ├── core/                     # Capa Core: Simulación, geometría y espacio\n│   │   ├── Geometry.hpp          # Primitivas geométricas, AABB y función de intersección\n│   │   ├── QuadTree.hpp          # Definición del árbol de partición espacial 2D\n│   │   ├── Track.hpp             # Geometría del circuito, splines y checkpoints\n│   │   ├── Car.hpp               # Cinemática física, sensores de raycasting y agente\n│   │   └── Simulation.hpp        # Controlador principal y bucle de juego\n│   ├── ai/                       # Capa de Inteligencia Artificial y Neuroevolución\n│   │   ├── NeuralNetwork.hpp     # Red neuronal feedforward multicapa y genoma\n│   │   ├── MaxHeap.hpp           # Estructura de datos Max-Heap (Cola de Prioridad genérica)\n│   │   └── GeneticAlgorithm.hpp  # Población, elitismo, cruce uniforme y mutación\n│   └── graphics/                 # Capa de Presentación e Interfaz\n│       └── HUD.hpp               # Panel de estadísticas, telemetría y métricas\n│\n├── src/                          # Implementaciones de código fuente (.cpp)\n│   ├── core/\n│   │   ├── QuadTree.cpp          # Implementación de inserción, subdivisión y podado\n│   │   ├── Track.cpp             # Generación por splines Catmull-Rom y muros\n│   │   ├── Car.cpp               # Física de aceleración, fricción y raycasting\n│   │   └── Simulation.cpp        # Inicialización, bucle Update/Render y eventos\n│   ├── ai/\n│   │   ├── NeuralNetwork.cpp     # Feedforward, activación Tanh y mutación continua\n│   │   └── GeneticAlgorithm.cpp  # Ciclo generativo y ranking con MaxHeap\n│   ├── graphics/\n│   │   └── HUD.cpp               # Dibujo de métricas, velocímetro y controles\n│   └── main.cpp                  # Punto de entrada de la aplicación\n│\n├── tests/                        # Pruebas unitarias independientes (validadas con CTest)\n│   ├── test_quadtree.cpp         # Verificación de subdivisión y podado espacial\n│   ├── test_neural_network.cpp   # Verificación de topología, activaciones y mutación\n│   └── test_genetic_algorithm.cpp# Verificación de propiedad Max-Heap y ciclo genético\n│\n└── assets/                       # Recursos visuales y texturas externas\n    ├── cars/                     # Modelos y sprites de vehículos\n    └── tracks/                   # Fondos y texturas de asfalto\n```\n\n---\n\n## 🔍 Detalle por Módulos y Archivos\n\n### 1. Capa Core (`include/core/`, `src/core/`)\n\n#### `Geometry.hpp`\n- **Propósito**: Proporciona las estructuras matemáticas básicas para el motor 2D sin dependencias de alto nivel.\n- **Estructuras**:\n  - `LineSegment`: Representa un segmento de pared o checkpoint con puntos `start` y `end`, e identificador numérico único para deduplicación rápida.\n  - `BoundingBox2D`: Rectángulo alineado a los ejes (**AABB**) utilizado para delimitar nodos del QuadTree, cajas de impacto de vehículos y áreas de consulta espacial.\n  - `SensorHit`: Registro del resultado del raycasting (distancia euclidiana, punto de impacto y normalización).\n  - `CheckLineIntersection`: Función matemática optimizada de intersección entre 2 segmentos de recta en 2D.\n\n#### `QuadTree.hpp` / `QuadTree.cpp`\n- **Propósito**: Implementa la estructura de datos jerárquica para partición espacial 2D.\n- **Responsabilidades**:\n  - Subdivisión recursiva en cuatro cuadrantes: `NW` (Noroeste), `NE` (Noreste), `SW` (Suroeste), `SE` (Sureste).\n  - Almacena los segmentos de la pista en los nodos correspondientes.\n  - Provee consultas podadas en tiempo logarítmico: `QueryRay()` para los sensores y `QueryBox()` para la colisión del vehículo.\n\n#### `Track.hpp` / `Track.cpp`\n- **Propósito**: Administra el trazado, la representación visual y los límites del circuito de carreras.\n- **Responsabilidades**:\n  - Generación procedimental mediante splines cúbicos **Catmull-Rom** para garantizar curvas suaves.\n  - Genera bordes interiores, exteriores, pianos (kerbs) y la línea divisoria discontinua.\n  - Inserta los segmentos de los muros en el `QuadTree`.\n  - Establece la secuencia ordenada de **69 checkpoints anti-trampas** transversales.\n\n#### `Car.hpp` / `Car.cpp`\n- **Propósito**: Modela la entidad del vehículo autónomo o manual.\n- **Responsabilidades**:\n  - Cinemática 2D: aceleración, frenado, velocidad angular, fricción dinámica y velocidad terminal.\n  - Proyección de 5 sensores de raycasting hacia los límites de la pista.\n  - Contiene una instancia de su cerebro (`NeuralNetwork`).\n  - Detección de colisión con las paredes indexadas en el `QuadTree`.\n  - Acumulación de fitness basada en checkpoints superados y penalización por inactividad.\n\n#### `Simulation.hpp` / `Simulation.cpp`\n- **Propósito**: Clase controladora principal (Game Engine) que orquesta la aplicación.\n- **Responsabilidades**:\n  - Inicialización de la ventana gráfica y contexto de OpenGL mediante Raylib.\n  - Gestión de entrada del usuario (teclado: `WASD`, `M`, `Espacio`, `Q`, `R`).\n  - Control de modos: Modo Manual (conducción individual) vs Modo Genético (Neuroevolución de 40 agentes).\n  - Control de velocidad temporal de la simulación ($\\times 1$, $\\times 2$, $\\times 5$).\n\n---\n\n### 2. Capa AI (`include/ai/`, `src/ai/`)\n\n#### `NeuralNetwork.hpp` / `NeuralNetwork.cpp`\n- **Propósito**: Red neuronal artificial Feedforward densa.\n- **Responsabilidades**:\n  - Topología por defecto: **6 entradas** (5 distancias de sensores + 1 velocidad actual) $\\to$ **8 neuronas ocultas** $\\to$ **2 salidas** (ángulo de viraje y aceleración/freno).\n  - Activación no lineal mediante tangente hiperbólica ($\\tanh$), garantizando salidas normalizadas en $[-1, 1]$.\n  - Métodos para serializar y deserializar los pesos y sesgos en un vector lineal (`std::vector<float>`) para operar como genoma.\n  - Operadores de mutación gaussiana continua y cruce uniforme (*Uniform Crossover*).\n\n#### `MaxHeap.hpp`\n- **Propósito**: Estructura de datos avanzada tipo **Montículo Máximo (Priority Queue)** genérica basada en plantillas (`template <typename T, typename Compare>`).\n- **Responsabilidades**:\n  - Inserción en tiempo $O(\\log n)$ mediante `SiftUp`.\n  - Extracción del individuo con mayor fitness en tiempo $O(\\log n)$ mediante `SiftDown`.\n  - Permite implementar selección por elitismo en tiempo $O(k \\log n)$ sin el costo de ordenar el vector completo $O(n \\log n)$.\n\n#### `GeneticAlgorithm.hpp` / `GeneticAlgorithm.cpp`\n- **Propósito**: Motor de neuroevolución poblacional.\n- **Responsabilidades**:\n  - Mantiene una población de 40 agentes simultáneos.\n  - Evalúa la aptitud individual según progreso en el circuito y tiempo de vida.\n  - Detecta cuándo todos los autos han colisionado o se ha alcanzado el límite de tiempo de la generación.\n  - Ejecuta la transición generacional: Selección elitista con `MaxHeap`, cruce entre los mejores individuos y mutación continua en la descendencia.\n\n---\n\n### 3. Capa Graphics (`include/graphics/`, `src/graphics/`)\n\n#### `HUD.hpp` / `HUD.cpp`\n- **Propósito**: Renderizado de la interfaz de usuario y telemetría en tiempo real.\n- **Responsabilidades**:\n  - Panel flotante adaptativo integrado en el infield central del circuito.\n  - Muestra: Generación actual, número de autos activos vs colisionados, mejor fitness de la generación y récord histórico.\n  - Barra de telemetría: Velocidad del líder, ángulo de viraje y estado del QuadTree.\n  - Indicador de multiplicador de velocidad ($\\times 1, \\times 2, \\times 5$).\n\n---\n\n### 4. Capa de Pruebas Unitarias (`tests/`)\n\n- **`test_quadtree.cpp`**: Valida que la estructura subdivida correctamente los cuadrantes al superar la capacidad máxima y que `QueryRange` y `QueryRay` retornen únicamente los segmentos relevantes sin falsos negativos.\n- **`test_neural_network.cpp`**: Verifica las dimensiones del *forward pass*, los rangos válidos de salida con $\\tanh$, la consistencia de aplanamiento de genoma y la correcta aplicación de la mutación.\n- **`test_genetic_algorithm.cpp`**: Valida las operaciones `Push`, `PopMax` y `PeekMax` del `MaxHeap`, el orden descendente estricto por fitness y la integridad del ciclo generativo.\n\n---\n\n## 🔄 Ciclo de Vida por Cuadro (Frame Lifecycle)\n\nEn cada fotograma de la simulación, el ciclo principal ejecuta el siguiente flujo ordenado:\n\n```\n                      ┌────────────────────────────┐\n                      │    Inicio de Fotograma     │\n                      └─────────────┬──────────────┘\n                                    │\n                                    ▼\n                      ┌────────────────────────────┐\n                      │   1. Procesar Input (E/S)  │\n                      │  - Teclas WASD / Flechas   │\n                      │  - Cambios de modo (M)     │\n                      │  - Velocidad (Espacio)     │\n                      └─────────────┬──────────────┘\n                                    │\n                                    ▼\n                      ┌────────────────────────────┐\n                      │    2. Update Simulación    │\n                      │ (Se repite N veces si x2/x5)\n                      │                            │\n                      │ a) Raycasting con QuadTree │\n                      │ b) Forward Pass en Redes   │\n                      │ c) Actualizar Cinemática   │\n                      │ d) Verificar Checkpoints   │\n                      │ e) Detección de Colisiones │\n                      │ f) ¿Generación terminada?  │\n                      │    --> MaxHeap Evolve      │\n                      └─────────────┬──────────────┘\n                                    │\n                                    ▼\n                      ┌────────────────────────────┐\n                      │    3. Renderizado Visual   │\n                      │  - Pista, Césped y Pianos  │\n                      │  - Checkpoints / Debug     │\n                      │  - Autos y Sensores Rayos  │\n                      │  - Panel HUD de Telemetría │\n                      └─────────────┬──────────────┘\n                                    │\n                                    ▼\n                      ┌────────────────────────────┐\n                      │     Fin de Fotograma       │\n                      │   (Sincronización 60 FPS)  │\n                      └────────────────────────────┘\n```\n\n"}, "ARCHITECTURE.md": "architecture", "data_structures": {"id": "data_structures", "filename": "DATA_STRUCTURES.md", "title": "Estructuras de Datos Avanzadas", "icon": "🌳", "category": "Programación 3", "badge": "Árboles & Heaps", "content": "# 🌳 Estructuras de Datos Avanzadas (Programación 3)\n\nEste documento detalla los fundamentos teóricos, la implementación en C++ y el análisis de complejidad asintótica de las estructuras de datos avanzadas desarrolladas para **NeuroGenetica**.\n\n---\n\n## 1. 🔲 QuadTree (Árbol de Partición Espacial 2D)\n\n### 📌 Justificación del Problema\nEn la simulación, cada vehículo proyecta **5 rayos sensores** continuos y posee una **caja de colisión** de 4 esquinas. En una pista con $W$ segmentos de pared y una población de $N$ vehículos:\n- **Enfoque ingenuo (fuerza bruta)**: Comparar cada sensor y cada esquina contra todos los segmentos de la pista en cada fotograma requiere:\n\n  > ⏱️ **Complejidad:** `O(N × S × W)`\n\n  $$\\text{Complejidad} = O(N \\times S \\times W)$$\n\n  Para 40 vehículos con 5 sensores y una pista de 300 segmentos, esto representa más de **60,000 pruebas de intersección por cuadro**, lo que destruye la tasa de fotogramas (FPS) e imposibilita acelerar la simulación a $\\times 2$ o $\\times 5$.\n\n- **Solución con QuadTree**: Se particiona el plano 2D recursivamente en cuadrantes. Los sensores y autos solo interrogan a los segmentos contenidos en los cuadrantes que atraviesan, reduciendo la búsqueda a tiempo logarítmico:\n\n  > ⏱️ **Complejidad:** `O(N × S × log W)`\n\n  $$\\text{Complejidad} = O(N \\times S \\times \\log W)$$\n\n---\n\n### 🧱 Representación en Memoria y Subdivisión\n\nUn `QuadTree` está delimitado por una caja envolvente alineada a los ejes (**AABB** - `BoundingBox2D`):\n\n```\n       (x, y) ┌─────────────────┬─────────────────┐\n              │                 │                 │\n              │  NorthWest (NW) │  NorthEast (NE) │\n              │                 │                 │\n              ├─────────────────┼─────────────────┤\n              │                 │                 │\n              │  SouthWest (SW) │  SouthEast (SE) │\n              │                 │                 │\n              └─────────────────┴─────────────────┘ (x + w, y + h)\n```\n\nCada nodo contiene:\n- `boundary`: Región espacial `BoundingBox2D` cubierta por el nodo.\n- `capacity`: Umbral máximo de segmentos antes de subdividir (configurado en **4**).\n- `maxDepth`: Profundidad máxima del árbol para evitar recursión infinita (configurado en **6**).\n- `segments`: Lista local de segmentos de línea (`std::vector<LineSegment>`).\n- 4 punteros inteligentes (`std::unique_ptr<QuadTree>`) hacia sus hijos:\n  - `northWest`\n  - `northEast`\n  - `southWest`\n  - `southEast`\n\n---\n\n### ⚙️ Algoritmos del QuadTree\n\n#### Inserción (`Insert`)\n1. Si el segmento no intersecta ni está contenido en el `boundary` del nodo actual, se descarta (`return false`).\n2. Si el nodo no está dividido y no ha superado su capacidad:\n   - Se almacena el segmento en la lista local del nodo.\n3. Si supera la capacidad y `currentDepth < maxDepth`:\n   - Se crean los 4 cuadrantes hijos (`Subdivide`).\n   - Se redistribuyen los segmentos existentes entre los hijos que los intersequen.\n   - Se propaga el nuevo segmento hacia los hijos correspondientes.\n\n#### Consulta de Rango (`QueryRange` / `QueryBox`)\nPermite recuperar todos los segmentos candidatos en la vecindad de un vehículo:\n1. Si el área de consulta no se solapa con el `boundary` del nodo actual, **se poda la rama completa** (no se desciende).\n2. Se añaden los segmentos propios del nodo a la lista de resultados.\n3. Si el nodo está subdividido, se invoca recursivamente `QueryRange` en los 4 cuadrantes.\n\n#### Consulta de Rayos (`QueryRay`)\nOptimiza el raycasting de los sensores:\n1. Se evalúa si el segmento del rayo $(P_{\\text{inicio}}, P_{\\text{fin}})$ interseca el `boundary` del nodo mediante pruebas rápidas de caja AABB.\n2. Si interseca, se recopilan los segmentos de pared y se continúa recursivamente hacia los cuadrantes intersecados.\n3. El cálculo costoso de intersección de rectas solo se realiza contra este subconjunto mínimo de candidatos.\n\n---\n\n### 📊 Tabla de Complejidad del QuadTree\n\n| Operación | Caso Promedio | Peor Caso (Degenerado) | Espacio |\n| :--- | :---: | :---: | :---: |\n| **Construcción / Inserción** | $O(W \\log W)$ | $O(W^2)$ | $O(W \\times \\text{profundidad})$ |\n| **Consulta por Rayo (`QueryRay`)** | $O(\\log W)$ | $O(W)$ | $O(1)$ auxiliar |\n| **Consulta por Caja (`QueryBox`)** | $O(\\log W)$ | $O(W)$ | $O(1)$ auxiliar |\n\n---\n\n## 2. 🏔️ Max-Heap (Cola de Prioridad Genérica)\n\n### 📌 Justificación del Problema\nAl finalizar cada generación en el **Algoritmo Genético**, se debe identificar al top $k$ de individuos con mayor aptitud (*fitness*) para aplicar **elitismo** (preservación intacta) y seleccionarlos como progenitores del cruce (*crossover*).\n- **Ordenar el vector completo con `std::sort`**:\n\n  > ⏱️ **Complejidad:** `O(N · log N)`\n\n  $$\\text{Complejidad} = O(N \\log N)$$\n\n- **Selección mediante Max-Heap**:\n  1. Insertar los $N$ individuos en el montículo: `O(N log N)` (o `O(N)` con heapify).\n  2. Extraer únicamente los $k$ mejores individuos mediante `PopMax()`:\n\n     > ⏱️ **Complejidad:** `O(k · log N)`\n\n     $$\\text{Complejidad} = O(k \\log N)$$\n\n  Dado que la población es $N = 40$ y el número de élite es pequeño ($k \\ll N$), el Max-Heap es la estructura óptima para la selección por prioridad.\n\n---\n\n### 🧱 Representación en Memoria\n\nEl `MaxHeap<T, Compare>` está implementado sobre un arreglo contiguo (`std::vector<T>`), mapeando el árbol binario completo mediante índices:\n\n```\n               [0] Raíz (Máximo)\n              /   \\\n            /       \\\n          [1]       [2]\n         /   \\     /   \\\n       [3]   [4] [5]   [6]\n```\n\nPara cualquier nodo en el índice $i$:\n- **Hijo Izquierdo**: $2i + 1$\n- **Hijo Derecho**: $2i + 2$\n- **Padre**: $\\lfloor (i - 1) / 2 \\rfloor$\n\n#### Invariante del Montículo Máximo\nPara todo nodo $i > 0$:\n\n> 📐 **Invariante:** `Elemento[Padre(i)] ≥ Elemento[i]`\n\n$$\\text{Elemento}[\\text{Padre}(i)] \\ge \\text{Elemento}[i]$$\n\n---\n\n### ⚙️ Métodos Principales\n\n#### `Push(const T& item)`\n1. Inserta el nuevo elemento al final del vector (`heap.push_back(item)`).\n2. Ejecuta `SiftUp` desde la última posición para restaurar el invariante, intercambiando el elemento con su padre mientras sea mayor que este.\n- **Complejidad**: $O(\\log n)$.\n\n#### `PopMax()`\n1. Guarda el valor de la raíz (`heap[0]`), que contiene el valor máximo garantizado.\n2. Mueve el último elemento a la raíz (`heap[0] = heap.back()`) y elimina el último elemento.\n3. Ejecuta `SiftDown` desde la raíz para restaurar el invariante, intercambiando con el mayor de sus dos hijos mientras alguno de ellos sea superior.\n- **Complejidad**: $O(\\log n)$.\n\n#### `PeekMax()`\n- Retorna una referencia constante a la raíz (`heap[0]`).\n- **Complejidad**: $O(1)$.\n\n---\n\n### 📊 Tabla de Complejidad del Max-Heap\n\n| Operación | Complejidad Temporal | Complejidad Espacial |\n| :--- | :---: | :---: |\n| **`Push` (Inserción)** | $O(\\log n)$ | $O(1)$ amortizado |\n| **`PopMax` (Extracción del máximo)** | $O(\\log n)$ | $O(1)$ |\n| **`PeekMax` (Consulta del máximo)** | $O(1)$ | $O(1)$ |\n| **`IsEmpty` / `Size`** | $O(1)$ | $O(1)$ |\n| **Selección de Top-$k$ elementos** | $O(k \\log n)$ | $O(n)$ |\n\n---\n\n## 3. 🌳 Árbol de Partición Espacial 3D (`SpatialTree3D`) y Optimización de Sensores\n\n**Responsable:** Kerwin Quintero  \n**Materia:** Programación 3 (Estructuras de Datos y Optimización)\n\n### 📌 Justificación del Problema en 3D\nAl migrar la simulación de 2D a un entorno **tridimensional (Godot 4 + GDExtension)** con pistas de 4 carriles, múltiples vehículos con física independiente y sensores volumétricos:\n1. **Verificación de límites en pista (`is_on_track`)**: En el enfoque ingenuo, cada auto recorre los $P = 138$ puntos de la línea central en cada fotograma. Para una parrilla de $N$ vehículos a 60 FPS:\n   $$\\text{Operaciones} = N \\times P \\times 60 \\approx 82,800 \\text{ comparaciones/segundo}$$\n2. **Cálculo de Sensores de Distancia (Raycasting)**: Cada vehículo evalúa 5 rayos sensores continuos. Si se comprueban distancias euclidianas ingenuas mediante raíces cuadradas ($\\sqrt{}$) y divisiones de punto flotante en cada cuadro, se sobrecarga la FPU (unidad de punto flotante de la CPU), impidiendo la aceleración temporal (2x, 4x).\n\n---\n\n### 🧱 Representación en Memoria del `SpatialTree3D`\n\nLa estructura particiona el espacio horizontal del circuito ($X, Z$) con altura vertical delimitada ($Y$) mediante una jerarquía de cajas envolventes **AABB 3D** (`Axis-Aligned Bounding Box`):\n\n```\n       (X_min, Y_min, Z_min)\n       ┌────────────────────────┬────────────────────────┐\n       │                        │                        │\n       │    Sub-árbol NW        │     Sub-árbol NE       │\n       │    (X-, Z-)            │     (X+, Z-)           │\n       │                        │                        │\n       ├────────────────────────┼────────────────────────┤\n       │                        │                        │\n       │    Sub-árbol SW        │     Sub-árbol SE       │\n       │    (X-, Z+)            │     (X+, Z+)           │\n       │                        │                        │\n       └────────────────────────┴────────────────────────┘ (X_max, Y_max, Z_max)\n```\n\nCada nodo del árbol (`SpatialNode`) contiene:\n- `bounds`: Caja envolvente tridimensional `AABB`.\n- `depth`: Profundidad en el árbol (acotada a `max_depth = 6` para mantener balanceo).\n- `points`: Lista de primitivas/coordenadas del circuito (máximo `max_points_per_node = 4`).\n- `children`: Arreglo de 4 hijos espaciales tras subdivisión (`NW`, `NE`, `SW`, `SE`).\n- `is_divided`: Bandera booleana de estado de subdivisión.\n\n---\n\n### ⚙️ Algoritmos de Optimización de Cálculos de Sensores\n\n#### 1. Poda Espacial por AABB (*Bounding Box Pruning*)\nAl buscar el elemento o muro más cercano a una posición o rayo sensor:\n- Se calcula la distancia euclidiana mínima del punto de consulta a la caja `AABB` del nodo.\n- **Criterio de Poda**: Si la distancia mínima a la caja del nodo es mayor o igual que la mejor distancia encontrada hasta el momento:\n  $$\\text{dist\\_box}^2 \\ge \\text{best\\_dist}^2 \\implies \\text{Podar rama completa (no descender)}$$\n- Se descartan subárboles enteros con decenas de geometrías sin evaluar un solo punto individual.\n\n#### 2. Eliminación de Raíces Cuadradas Intermedias ($d^2$)\nEl cálculo de la norma euclidiana $\\|\\vec{v}\\| = \\sqrt{\\Delta x^2 + \\Delta y^2 + \\Delta z^2}$ requiere la instrucción `SQRT` de la CPU, la cual consume entre 15 y 30 ciclos de reloj por llamada:\n- En las pruebas de proximidad de sensores y límites de pista se utiliza exclusivamente la **distancia al cuadrado ($d^2$)**:\n  $$d^2 = \\Delta x^2 + \\Delta z^2$$\n- Solo se aplica una única raíz cuadrada al final, sobre el impacto ganador para la normalización en $[0.0, 1.0]$.\n\n#### 3. Multiplicación por Recíproco en Normalización\nLa división de punto flotante (`/`) es hasta 4 veces más costosa que la multiplicación (`*`):\n- Se precalcula el inverso del alcance del sensor:\n  $$\\text{INV\\_MAX\\_RANGE} = \\frac{1.0}{R_{\\text{max}}}$$\n- Cada lectura de sensor se normaliza mediante una multiplicación directa:\n  $$d_{\\text{norm}} = \\text{dist} \\times \\text{INV\\_MAX\\_RANGE}$$\n\n---\n\n### 📊 Comparativa de Complejidad Asintótica\n\n| Componente / Operación | Fuerza Bruta (Ingenua) | Con Estructuras de Datos (Kerwin) | Aceleración Obtenida |\n| :--- | :---: | :---: | :---: |\n| **Localización en Pista (`is_on_track`)** | $O(P)$ lineal | **$O(\\log P)$ logarítmico** | $\\approx 25\\times$ más rápido |\n| **Consulta por Rayo de Sensor** | $O(W)$ lineal | **$O(\\log W)$ logarítmico** | $\\approx 18\\times$ más rápido |\n| **Ranking y Podio de Carrera** | $O(N \\log N)$ (Sort completo) | **$O(k \\log N)$ (Max-Heap)** | Inmediato, sin caídas de FPS |\n| **Selección Elitista en Neuroevolución** | $O(N \\log N)$ | **$O(k \\log N)$ (Max-Heap)** | Óptimo para $k \\ll N$ |\n\n\n"}, "DATA_STRUCTURES.md": "data_structures", "ai_physics": {"id": "ai_physics", "filename": "AI_AND_PHYSICS.md", "title": "Física, Sensores y Neuroevolución", "icon": "🧠", "category": "Inteligencia Artificial", "badge": "Redes & GA", "content": "# 🧠 Física, Redes Neuronales y Neuroevolución\n\nEste documento detalla los principios matemáticos, el modelo físico 2D y la arquitectura de aprendizaje por neuroevolución implementados en **NeuroGenetica**.\n\n---\n\n## 1. 🏎️ Modelo Cinemático del Vehículo\n\nEl movimiento del vehículo se calcula mediante cinemática 2D en tiempo discreto:\n\n### Parámetros Físicos\n- $\\vec{p} = (x, y)$: Posición actual en el plano.\n- $\\theta$: Ángulo de orientación en radianes (donde $0$ apunta a la derecha, en el eje $+X$).\n- $v$: Velocidad escalar lineal.\n- $a_{\\text{max}}$: Aceleración máxima hacia adelante.\n- $\\mu$: Coeficiente de fricción aerodinámica y de rodamiento ($0 < \\mu < 1$).\n- $\\omega$: Tasa de viraje angular.\n\n### Ecuaciones de Movimiento por Fotograma\n\n1. **Aceleración y Fricción**:  \n   Dado el comando de aceleración $u_a \\in [-1, 1]$:\n\n   > 📐 **Fórmula:** `v(t+1) = (v(t) + u_a · a_max) · (1 - μ)`  \n   > 🚦 **Límites:** `-v_max_rev ≤ v(t+1) ≤ v_max`\n\n   $$v_{t+1} = (v_t + u_a \\cdot a_{\\text{max}}) \\cdot (1 - \\mu)$$\n\n   $$-v_{\\text{max\\_rev}} \\le v_{t+1} \\le v_{\\text{max}}$$\n\n2. **Rotación Dependiente de la Velocidad**:  \n   Dado el comando de viraje $u_s \\in [-1, 1]$:  \n   Un vehículo real no puede rotar sobre su propio eje si está detenido. Por ende, la velocidad angular es proporcional a la velocidad lineal:\n\n   > 📐 **Fórmula:** `θ(t+1) = θ(t) + u_s · ω · (v(t+1) / v_max)`\n\n   $$\\theta_{t+1} = \\theta_t + u_s \\cdot \\omega \\cdot \\left(\\frac{v_{t+1}}{v_{\\text{max}}}\\right)$$\n\n3. **Integración de Posición**:\n\n   > 📐 **Fórmula:**  \n   > `pos_x(t+1) = pos_x(t) + [v(t+1) · cos(θ(t+1))] · Δt`  \n   > `pos_y(t+1) = pos_y(t) + [v(t+1) · sin(θ(t+1))] · Δt`\n\n   $$\\vec{p}_{t+1} = \\vec{p}_t + \\begin{pmatrix} v_{t+1} \\cos(\\theta_{t+1}) \\\\ v_{t+1} \\sin(\\theta_{t+1}) \\end{pmatrix} \\cdot \\Delta t$$\n\n---\n\n## 2. 📡 Sistema de Sensores (Raycasting)\n\nCada vehículo cuenta con **5 sensores de distancia ultrasónicos/ópticos simulados**, distribuidos en abanico frontal:\n\n```\n            -30°       0°       +30°\n              \\        |        /\n               \\       |       /\n       -60° ----\\      |      /---- +60°\n                 \\     |     /\n                  ┌────┴────┐\n                  │   Auto  │\n                  └─────────┘\n```\n\n- **Ángulos de Proyección**: $\\{-60^\\circ, -30^\\circ, 0^\\circ, +30^\\circ, +60^\\circ\\}$.\n- **Alcance Máximo ($R_{\\text{max}}$)**: 150 píxeles.\n- **Normalización**:  \n  Para cada rayo $i$, la lectura entregada a la red neuronal es:\n\n  > 📐 **Fórmula:** `d_i = distancia_impacto / R_max ∈ [0.0, 1.0]`\n\n  $$d_i = \\frac{\\text{distancia\\_impacto}}{R_{\\text{max}}} \\in [0.0, 1.0]$$\n\n  Donde:\n  - $0.0$: Obstáculo inmediato (colisión inminente).\n  - $1.0$: Espacio totalmente despejado dentro del rango del sensor.\n\n---\n\n## 3. 🧠 Red Neuronal Feedforward\n\nCada agente es controlado por una **Red Neuronal Artificial (ANN)** multicapa completamente conectada (*Dense Feedforward*).\n\n```\n   Capa de Entrada (6)         Capa Oculta (8)           Capa de Salida (2)\n   ┌─────────────────┐       ┌─────────────────┐       ┌─────────────────┐\n   │ Sensor -60° (d0)│───┐   │                 │   ┌───│ Viraje [-1, 1]  │\n   │ Sensor -30° (d1)│───┼──►│  Neuronas con   │───┤   └─────────────────┘\n   │ Sensor   0° (d2)│───┼──►│   Activación    │   │   ┌─────────────────┐\n   │ Sensor +30° (d3)│───┼──►│  Tanh(z) en R   │───┴──►│Acel/Freno [-1, 1]\n   │ Sensor +60° (d4)│───┼──►│                 │       └─────────────────┘\n   │ Velocidad norm  │───┘   └─────────────────┘\n   └─────────────────┘\n```\n\n### Formulación Matemática\n\n1. **Capa Oculta**:\n\n   > 📐 **Fórmula:** `z_h = W_1 · x + b_1`  |  `a_h = tanh(z_h)`\n\n   $$\\vec{z}_h = \\mathbf{W}_1 \\cdot \\vec{x} + \\vec{b}_1$$\n\n   $$\\vec{a}_h = \\tanh(\\vec{z}_h)$$\n\n   Donde $\\mathbf{W}_1 \\in \\mathbb{R}^{8 \\times 6}$ y $\\vec{b}_1 \\in \\mathbb{R}^8$.\n\n2. **Capa de Salida**:\n\n   > 📐 **Fórmula:** `z_o = W_2 · a_h + b_2`  |  `y = tanh(z_o)`\n\n   $$\\vec{z}_o = \\mathbf{W}_2 \\cdot \\vec{a}_h + \\vec{b}_2$$\n\n   $$\\vec{y} = \\tanh(\\vec{z}_o)$$\n\n   Donde $\\mathbf{W}_2 \\in \\mathbb{R}^{2 \\times 8}$ y $\\vec{b}_2 \\in \\mathbb{R}^2$.\n\n3. **Interpretación de las Salidas**:\n   - $y_0 \\in [-1, 1]$: Control de viraje ($-1$ = izquierda máxima, $+1$ = derecha máxima).\n   - $y_1 \\in [-1, 1]$: Control de acelerador/freno ($-1$ = freno total / reversa, $+1$ = aceleración máxima).\n\n### Genoma Lineal\nTodas las matrices de pesos y vectores de sesgo se serializan en un único vector continuo unidimensional:\n\n> 📐 **Fórmula:** `Genoma = [W_1, b_1, W_2, b_2] ∈ R^74`\n\n$$\\text{Genoma} = [\\mathbf{W}_1, \\vec{b}_1, \\mathbf{W}_2, \\vec{b}_2] \\in \\mathbb{R}^{74}$$\n\n- Pesos capa oculta: $8 \\times 6 = 48$.\n- Sesgos capa oculta: $8$.\n- Pesos capa salida: $2 \\times 8 = 16$.\n- Sesgos capa salida: $2$.\n- **Total de genes por individuo**: **74 parámetros en punto flotante**.\n\n---\n\n## 4. 🧬 Algoritmo Genético y Neuroevolución\n\nA diferencia del entrenamiento supervisado tradicional con retropropagación (*Backpropagation*), la neuroevolución optimiza los pesos de la red a través de la selección natural:\n\n### 1. Función de Aptitud (Fitness)\nEl fitness mide el progreso real a lo largo del circuito:\n\n> 📐 **Fórmula:** `Fitness = (Checkpoints_Superados × 1000) + Distancia_Recorrida - Penalización_Inactividad`\n\n$$\\text{Fitness} = (\\text{Checkpoints Superados} \\times 1000) + \\text{Distancia Recorrida} - \\text{Penalización por Inactividad}$$\n\n#### Mecanismos Anti-Trampas\n- **Validación Secuencial**: Un auto solo puede registrar el checkpoint $k+1$ si acaba de validar el checkpoint $k$. No puede ganar puntos retrocediendo o girando en círculos.\n- **Temporizador de Inactividad**: Si un auto no alcanza un nuevo checkpoint en más de **2.5 segundos** o permanece inmóvil, se marca inmediatamente como colisionado/muerto para no ralentizar la generación.\n\n### 2. Selección por Elitismo (Max-Heap)\n- Al culminar la generación, los 40 individuos se insertan en un `MaxHeap`.\n- Se extraen los $k = 2$ mejores individuos ($O(k \\log N)$), cuyos genomas pasan **100% intactos** a la siguiente generación, asegurando que la aptitud histórica nunca decrezca.\n\n### 3. Cruce Genético (Uniform Crossover)\nPara engendrar nuevos individuos a partir de los progenitores élite $P_A$ y $P_B$:\n\n> 📐 **Fórmula:** `Hijo[i] = P_A[i] si r < 0.5, sino P_B[i]`\n\n$$\\text{Hijo}_i = \\begin{cases} P_{A, i} & \\text{si } r < 0.5 \\\\ P_{B, i} & \\text{si } r \\ge 0.5 \\end{cases}$$\n\nDonde $r \\sim \\mathcal{U}(0, 1)$ se genera aleatoriamente para cada uno de los 74 genes.\n\n### 4. Mutación Gaussiana Continua\nCon una tasa de mutación del **10%** por gen:\n\n> 📐 **Fórmula:** `Gen' = Gen + Ruido_Gaussiano(media=0, std=0.30)`\n\n$$\\text{Gen}' = \\text{Gen} + \\mathcal{N}(0, \\sigma^2)$$\n\nDonde la perturbación $\\sigma = 0.30$ altera suavemente los pesos sin destruir las representaciones aprendidas previamente.\n\n"}, "AI_AND_PHYSICS.md": "ai_physics", "guia_godot": {"id": "guia_godot", "filename": "GUIA_GODOT.md", "title": "Simulación 3D (Godot Engine 4)", "icon": "🏎️", "category": "Simulador 3D", "badge": "GDExtension", "content": "# 🏎️💨 NeuroGenetica 3D (Godot 4 + C++ GDExtension)\n\nVersión **Tridimensional** de **NeuroGenetica** con física 3D, pistas de 4 carriles, colisiones reales entre vehículos, sistema de energía/resistencia por impactos, perspectivas de cámara dinámicas (incluyendo **Vista GTA Cenital** e **Isométrica**), **Modo Copa** y conducción humana en tiempo real compitiendo contra la IA en C++.\n\n---\n\n## ✨ Nuevas Características 3D\n\n1. **Vehículos 3D con Daño y Resistencia (HP)**:\n   * Chasis tridimensional con colores distintivos por auto, ruedas modeladas, faros con emisión de luz y partículas de humo en caso de avería.\n   * **Sistema de Energía (100 HP)**: Los autos no mueren al primer roce; cada impacto (contra muros u otros autos) resta energía en función de la velocidad y el ángulo de colisión.\n   * Si la energía llega a 0, el auto queda destruido y se detiene en la pista como obstáculo.\n\n2. **Pistas 3D de 4 Carriles con Parrilla de Salida (Grid)**:\n   * Circuito ancho (22m) con líneas discontinuas de carril, pianos/bordillos rojiblancos y muros de contención con colisiones tridimensionales.\n   * **Parrilla de largada ordenada**: 10 autos colocados en 4 carriles (formación 4-4-2) con arranque limpio sin amontonamiento inicial.\n\n3. **Cámaras Multi-Perspectiva (Tecla `V`)**:\n   * 🎮 **Vista GTA Cenital (Top-Down)**: Cámara directa desde arriba del auto que rota suavemente acompañando la dirección de marcha (estilo *Grand Theft Auto 1 / 2 / Chinatown Wars*).\n   * 📐 **Vista Isométrica de Coche**: Perspectiva a 45° siguiendo al vehículo (estilo *Circuit Superstars* / *Micro Machines*).\n   * 🏎️ **Vista Tercera Persona (Chase)**: Trasera dinámica a ras de asfalto.\n   * 🌐 **Vista Panorámica General**: Vista aérea de todo el circuito.\n\n4. **Selección de Auto y Conducción Manual (Humano vs IA)**:\n   * Pulsa **`C`** para alternar qué auto seguir con la cámara y ver su telemetría en el HUD.\n   * Pulsa **`M`** para tomar el volante del auto enfocado y conducirlo tú mismo con **`W`, `A`, `S`, `D`** o las **`Flechas`**.\n\n5. **Pantalla de Inicio y Menú de Modos**:\n   * Pantalla de inicio con fondo 3D dinámico para elegir el modo de juego:\n     * **Modo Copa (Humano vs IAs)**: El jugador entra al volante en parrilla compitiendo contra 9 rivales de IA.\n     * **Modo Espectador**: Carrera de IAs con cámara isométrica libre.\n   * **Selector de Escuderías Rival Pre-entrenadas**:\n     * 🔰 *Escudería Novatos*: Redes neuronales aprendiendo desde cero.\n     * 🏎️ *Escudería GT Pro*: Redes calibradas en curvas rápidas.\n     * 👑 *Escudería Élite*: Redes agresivas de alta velocidad y adelantamientos.\n     * 📂 *Equipos Guardados*: Archivos guardados por ti con la tecla `G`.\n\n6. **Semáforo de Salida Oficial (Countdown)**:\n   * Antes de iniciar la carrera, todos los vehículos permanecen congelados en la parrilla.\n   * El semáforo realiza la cuenta regresiva oficial: **🔴 3... 🔴🔴 2... 🔴🔴🔴 1... 🟢🟢🟢 ¡¡GO!!**\n   * Al encenderse las luces verdes, todos los autos aceleran al unísono.\n\n7. **Pantalla de Resultados y Podio de la Copa**:\n   * Al cruzar la meta tras 2 vueltas o completarse el tiempo:\n     * Anuncio de ganador y podio oficial (1º, 2º, 3º...).\n     * Tabla con tiempos de carrera, velocidad punta, vueltas y puntos de Copa sumados.\n     * Botones para pasar a la siguiente ronda, reintentar la carrera o volver al menú.\n\n8. **Estructuras de Datos Avanzadas y Optimización de Sensores (Programación 3)**:\n   * **`SpatialTree3D` (Árbol de Partición Espacial 3D)**:\n     * Indexa los 138 puntos de la pista y muros en una jerarquía de cajas envolventes 3D (`AABB`).\n     * Reduce la comprobación de límites de pista (`is_on_track`) de un escaneo lineal $O(P)$ a búsqueda en tiempo logarítmico **$O(\\log P)$**.\n     * Poda automática de ramas lejanas para no desperdiciar ciclos de CPU.\n   * **`MaxHeap` (Montículo Binario / Cola de Prioridad)**:\n     * Clasificación de podio y ranking de la carrera en tiempo **$O(k \\log N)$** mediante `SiftDown`.\n     * Selección de los mejores individuos élite para evolución entre rondas de la Copa sin necesidad de ordenar todo el arreglo.\n   * **Optimización de Cálculos de Sensores**:\n     * Eliminación de raíces cuadradas ($\\sqrt{}$) en comprobaciones intermedias mediante distancias al cuadrado ($d^2$).\n     * Multiplicación por recíproco precalculado (`INV_MAX_RANGE`) para evitar divisiones de coma flotante.\n   * Puedes ver estas métricas en tiempo real pulsando la tecla **`I`** (ventana de telemetría).\n\n---\n\n## 🕹️ Controles del Juego\n\n| Tecla / Ratón | Acción |\n| :--- | :--- |\n| **`ESC`** | **Volver al Menú Principal** (durante la carrera) o **Salir del Juego** (en el Menú Principal). |\n| **`F11`** | **Pantalla Completa / Modo Ventana**: Alterna instantáneamente el tamaño de pantalla. |\n| **`Q`** | **Ver Divisiones de Pista 3D**: Activa/desactiva la visualización en 3D de las cajas del `SpatialTree3D`. |\n| **`TAB`** | **Alternar Modalidad** (Modo Copa Humano $\\leftrightarrow$ Modo Espectador Libre). |\n| **`G`** | **Guardar Generación**: Guarda los cerebros y datos en archivo `.json`. |\n| **`I`** | **Ver Telemetría y Estadísticas**: Abre/cierra la tabla completa de rendimiento. |\n| **`F5`** o **`Shift + R`** | **Reiniciar Todo**: Vuelve la Copa a Ronda 1, Gen 1 y puntos a cero. |\n| **`R`** *(sin Shift)* | **Bandera a Cuadros**: Termina la carrera actual y abre la pantalla de resultados. |\n| **`Arrastrar Ratón`** | **Desplazar la vista libremente** por la pista (en vista isométrica). |\n| **`Rueda del Ratón`** *(Scroll)* | **Zoom In / Zoom Out** suave sobre cualquier curva o auto. |\n| **`W`, `A`, `S`, `D`** / **`Flechas`** | Conducir tu auto (Modo Copa) o desplazar la vista (Modo Espectador). |\n| **`C`** / **`Shift + C`** | Cambiar el a
